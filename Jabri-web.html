<script>
const audio = document.getElementById('bgAudio');
const clickSound = new Audio('click.mp3');
let isPlaying = false;

function toggleAudio() {
  if (isPlaying) {
    audio.pause();
    document.querySelector('.audio-btn').textContent = '🔇';
  } else {
    audio.play();
    document.querySelector('.audio-btn').textContent = '🔊';
  }
  isPlaying = !isPlaying;
}

function playClick() {
  clickSound.play();
}
</script>
