<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 - واحة الجبري</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(145deg, #0b1a2e, #1a2f44);
      color: #f0e6d3;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 20px;
    }
    .container {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(10px);
      padding: 50px 40px;
      border-radius: 40px;
      border: 1px solid rgba(255, 215, 150, 0.2);
      max-width: 600px;
      box-shadow: 0 30px 50px rgba(0,0,0,0.6);
    }
    h1 { font-size: 80px; color: #d4a373; margin-bottom: 10px; }
    .sub { font-size: 24px; color: #e9c9a9; }
    .visitor-box {
      margin: 25px 0;
      padding: 15px;
      background: rgba(0,0,0,0.3);
      border-radius: 60px;
      font-size: 22px;
      border: 1px solid #b48b5a;
      display: inline-block;
      padding: 10px 30px;
    }
    .visitor-box span { color: #f7d44a; font-weight: bold; }
    .note {
      margin-top: 20px;
      font-size: 18px;
      color: #bbaa99;
    }
    .loader {
      margin: 30px auto 15px;
      width: 48px;
      height: 48px;
      border: 5px solid #b48b5a;
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .footer {
      margin-top: 30px;
      font-size: 14px;
      color: #8a7a6a;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🌿 404</h1>
    <div class="sub">عذرًا.. هذا الدرب غير موجود</div>

    <!-- عداد الزوار (جلب من localStorage أو بداية عشوائية) -->
    <div class="visitor-box">
      👥 عدد زوار الواحة: <span id="visitorCount">1</span>
    </div>

    <div class="loader"></div>
    <p style="margin-top:5px; font-size:15px; color:#bbaa88;">🎵 تشغيل نغمات السندباد...</p>

    <div class="note">
      سيتم تحويلك إلى <strong>واحة الجبري</strong> بعد 7 ثوانٍ
    </div>
    <div class="footer">🏛️ من صنعاء إلى الكون 🇾🇪</div>
  </div>

  <script>
    // 1) عداد الزوار (يتذكر الزائر عبر localStorage)
    let count = localStorage.getItem('jabriVisitorCount');
    if (count === null) {
      count = Math.floor(Math.random() * 80) + 20;   // بداية واقعية
    } else {
      count = Number(count) + 1;
    }
    localStorage.setItem('jabriVisitorCount', count);
    document.getElementById('visitorCount').textContent = count;

    // 2) تشغيل موسيقى خفيفة (نغم هادئ)
    try {
      const audio = new Audio('https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3');
      audio.volume = 0.15;
      audio.loop = true;
      audio.play().catch(() => {});
    } catch(e) {}

    // 3) التوجيه التلقائي إلى الواحة بعد 7 ثوانٍ
    setTimeout(() => {
      window.location.href = '/';
    }, 7000);
  </script>
  
  
  <!-- في كل صفحة HTML -->
<div id="header-placeholder"></div>
<div id="footer-placeholder"></div>
<script src="/js/init-page-root.js"></script>
<script src="/js/menu.js"></script>
  
</body>
</html>
