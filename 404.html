<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow">
  <title>404 — جاري البحث | واحة الجبري</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Cairo', 'Segoe UI', Tahoma, sans-serif;
      background: linear-gradient(145deg, #0b1a2e, #1a2f44);
      color: #f0e6d3;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      direction: rtl;
    }
    .container {
      background: rgba(255,255,255,0.05);
      backdrop-filter: blur(10px);
      padding: 30px 22px;
      border-radius: 30px;
      border: 1px solid rgba(255,215,150,0.2);
      max-width: 560px;
      width: 100%;
      box-shadow: 0 30px 50px rgba(0,0,0,0.6);
      text-align: center;
    }
    h1 { font-size: 5.5rem; font-weight: 900; color: #b48b5a;
      text-shadow: 0 0 60px rgba(180,139,90,0.5); line-height: 1; margin-bottom: 8px; }
    .sub { font-size: 1.3rem; margin-bottom: 22px; line-height: 1.6; }
    .box { background: #0b1a2e; border: 1px solid #b48b5a;
      border-radius: 14px; padding: 10px 14px; margin: 8px 0; text-align: right; }
    .box-label { font-size: 0.72rem; color: #b48b5a; margin-bottom: 5px;
      font-weight: 700; letter-spacing: 1px; }
    .box-value { font-family: 'Courier New', monospace; font-size: 0.82rem;
      color: #6ae3ff; direction: ltr; text-align: left; word-break: break-all;
      padding: 6px 10px; background: rgba(106,227,255,0.05);
      border-radius: 6px; border: 1px solid rgba(106,227,255,0.2); min-height: 28px; }
    #ovResult { color: #ffd166; }
    #ovResult.ok  { color: #06d6a0; }
    #ovResult.err { color: #ff6b6b; }
    .network-log { background: #000; border: 1px solid #6ae3ff;
      border-radius: 12px; padding: 10px 14px; margin: 12px 0;
      max-height: 200px; overflow-y: auto;
      font-family: 'Courier New', monospace; font-size: 11px;
      text-align: left; direction: ltr; }
    .network-log-title { color: #6ae3ff; font-size: 10px; margin-bottom: 6px;
      padding-bottom: 5px; border-bottom: 1px solid rgba(106,227,255,0.3);
      font-weight: 700; letter-spacing: 1px; }
    .log-line { padding: 3px 0; color: #8aa5b5; line-height: 1.5; word-break: break-all; }
    .log-line.info { color: #6ae3ff; }
    .log-line.ok   { color: #06d6a0; }
    .log-line.err  { color: #ff6b6b; }
    .log-line.warn { color: #ffd166; }
    .log-line.step { color: #b48b5a; font-weight: 700; }
    .log-line.cache{ color: #c77dff; }
    .visitor-box { margin: 14px auto;
      background: linear-gradient(135deg, #b48b5a, #8b6a3f);
      color: #0a0a0f; border-radius: 40px; padding: 9px 20px;
      font-weight: 700; font-size: 0.95rem; display: inline-block; }
    .visitor-box span { color: #0a0a0f; font-weight: 900; font-size: 1.15rem; }
    .loader { margin: 12px auto; width: 38px; height: 38px;
      border: 4px solid #b48b5a; border-top-color: transparent;
      border-radius: 50%; animation: spin404 0.9s linear infinite; }
    @keyframes spin404 { to { transform: rotate(360deg); } }
    .ov-countdown { margin: 8px 0; font-size: 0.95rem; color: #6ae3ff;
      font-family: monospace; font-weight: 700; }
    .stats-bar { display: flex; justify-content: space-around;
      background: rgba(106,227,255,0.05);
      border: 1px solid rgba(106,227,255,0.2);
      border-radius: 10px; padding: 8px; margin: 10px 0;
      font-family: monospace; font-size: 11px; }
    .stat-item { text-align: center; }
    .stat-num { color: #6ae3ff; font-weight: 900; font-size: 15px; display: block; }
    .stat-lbl { color: #8aa5b5; font-size: 9px; }
    .ov-options { display: grid; grid-template-columns: 1fr 1fr;
      gap: 8px; margin-top: 18px; }
    .ov-btn { padding: 12px 10px; border: none; border-radius: 14px;
      font-size: 0.82rem; font-weight: 900; font-family: inherit;
      cursor: pointer; text-decoration: none;
      display: flex; align-items: center; justify-content: center;
      gap: 6px; transition: transform 0.2s ease; }
    .ov-btn:hover { transform: scale(1.05); }
    .ov-btn-map  { background: linear-gradient(135deg, #6ae3ff, #3aa0c4); color: #0a0a0f; }
    .ov-btn-home { background: linear-gradient(135deg, #ffd700, #f0a500); color: #0a0a0f; }
    .ov-btn-waha { background: linear-gradient(135deg, #06d6a0, #05b98a); color: #0a0a0f; }
    .ov-btn-exit { background: linear-gradient(135deg, #ff6b6b, #e85555); color: #fff; }
    .footer { margin-top: 16px; font-size: 0.82rem; color: #b48b5a; }
    .version { margin-top: 6px; font-size: 11px; color: #444; font-family: monospace; }
    @media (max-width: 500px) {
      h1 { font-size: 4rem; }
      .sub { font-size: 1.1rem; }
      .ov-btn { font-size: 0.72rem; padding: 11px 6px; }
      .network-log { max-height: 150px; }
    }
  </style>
</head>
<body data-waha-404="true">
  <div class="container" id="jabri404Container">
    <h1>404</h1>
    <div class="sub">🏝️ عذرًا، هذا الدرب غير موجود</div>

    <div class="box">
      <div class="box-label">🔍 CURRENT PATH</div>
      <div class="box-value" id="ovCurrent">—</div>
    </div>

    <div class="box">
      <div class="box-label">➡️ TARGET PATH</div>
      <div class="box-value" id="ovTarget">—</div>
    </div>

    <div class="box">
      <div class="box-label">📊 RESULT</div>
      <div class="box-value" id="ovResult">⏳ Initializing...</div>
    </div>

    <div class="stats-bar">
      <div class="stat-item"><span class="stat-num" id="statNet">0</span><span class="stat-lbl">NET</span></div>
      <div class="stat-item"><span class="stat-num" id="statOk">0</span><span class="stat-lbl">OK</span></div>
      <div class="stat-item"><span class="stat-num" id="statErr">0</span><span class="stat-lbl">ERR</span></div>
      <div class="stat-item"><span class="stat-num" id="statCache">0</span><span class="stat-lbl">CACHE</span></div>
      <div class="stat-item"><span class="stat-num" id="statMs">0</span><span class="stat-lbl">MS</span></div>
    </div>

    <div class="network-log" id="networkLog">
      <div class="network-log-title">🌐 PROCESS LOG</div>
    </div>

    <div class="visitor-box">
      👥 عدد الزوار: <span id="visitorCount">1</span>
    </div>

    <div class="loader"></div>

    <div class="ov-countdown" id="ovCountdown">⏱️ 7s</div>

    <div class="ov-options">
      <a href="/all-links.html" class="ov-btn ov-btn-map">🗺️ خريطة</a>
      <a href="/index.html" class="ov-btn ov-btn-home">🏠 افتتاح</a>
      <a href="/Page11.html" class="ov-btn ov-btn-waha">🏝️ الواحة</a>
      <button onclick="exitPage()" class="ov-btn ov-btn-exit">🚪 خروج</button>
    </div>

    <div class="footer">🏛️ من صنعاء إلى الكون 🇾🇪</div>
    <div class="version">v8.1.0 — Standalone Beast</div>
  </div>

  <script>
    (function() {
      'use strict';

      var hasInitRoot = !!window.Jabri;
      var sessionHandled = sessionStorage.getItem('jabri404Handled') === 'true';

      if (hasInitRoot || sessionHandled) {
        console.log('🛡️ [404.html] Yielding to init-page-root.js');
        var ourContainer = document.getElementById('jabri404Container');
        if (ourContainer) ourContainer.style.display = 'none';
        window.__jabri404Delegated = true;
        return;
      }

      sessionStorage.setItem('jabri404Handled', 'true');
      console.log('🚀 [404.html] Standalone mode');
      window.__jabri404Standalone = true;
    })();
  </script>

  <script>
    (function() {
      'use strict';

      if (window.__jabri404Delegated) {
        console.log('🛡️ [404] script skipped (delegated)');
        return;
      }

      var CONFIG = {
        allLinksPath: '/all-links.html',
        indexPath:    '/index.html',
        wahaPath:     '/Page11.html',
        autoTryAfter: 1500,
        fetchTimeout: 3000,
        maxCacheSize: 50,
        maxLogLines:  100
      };

      var VERSION = '8.1.0';

      window.__jabriNetStats = {
        total: 0, ok: 0, err: 0,
        cache: 0, startTime: performance.now()
      };

      if (!window.__jabriFetchWrapped) {
        window.__jabriFetchWrapped = true;
        var _origFetch = window.fetch;
        var _exclude = ['version.json', 'favicon.ico'];

        window.fetch = function(input, init) {
          var url = typeof input === 'string' ? input : (input && input.url) || '';
          var skip = _exclude.some(function(ex) { return url.indexOf(ex) !== -1; });
          var start = performance.now();
          var promise = _origFetch.call(this, input, init);
          if (skip) return promise;

          return promise.then(function(res) {
            var ms = Math.round(performance.now() - start);
            var s = res.status;
            var type = (s >= 200 && s < 300) ? 'ok' : (s >= 400) ? 'err' : 'warn';
            window.__jabriNetStats.total++;
            if (type === 'ok') window.__jabriNetStats.ok++;
            else if (type === 'err') window.__jabriNetStats.err++;
            updateStatsBar();
            logStep('NET', s + ' ' + ms + 'ms ' + url, type);
            return res;
          }).catch(function(err) {
            window.__jabriNetStats.total++;
            window.__jabriNetStats.err++;
            updateStatsBar();
            logStep('NET', 'FAIL ' + url, 'err');
            throw err;
          });
        };
      }

      async function fileExists(url) {
        try {
          var controller = new AbortController();
          var tid = setTimeout(function() { controller.abort(); }, CONFIG.fetchTimeout);
          var res = await fetch(url, {
            method: 'GET',
            headers: { 'Range': 'bytes=0-0' },
            signal: controller.signal,
            cache: 'no-store',
            redirect: 'manual'
          });
          clearTimeout(tid);
          controller.abort();
          return res.ok || res.status === 206 || res.status === 0;
        } catch (e) { return false; }
      }

      var _resolveCache = new Map();

      function cacheSet(key, val) {
        if (_resolveCache.size >= CONFIG.maxCacheSize) {
          var firstKey = _resolveCache.keys().next().value;
          _resolveCache.delete(firstKey);
        }
        _resolveCache.set(key, val);
        window.__jabriNetStats.cache = _resolveCache.size;
        updateStatsBar();
      }

      async function resolveFile(rawPath) {
        if (_resolveCache.has(rawPath)) {
          logStep('CACHE', 'HIT: ' + rawPath, 'cache');
          return _resolveCache.get(rawPath);
        }
        logStep('RESOLVE', 'MISS: ' + rawPath, 'step');

        var clean = rawPath.replace(/^\/+|\/+$/g, '');
        var last  = clean.split('/').pop() || 'index';

        var candidates = [
          '/' + clean + '.html',
          '/' + clean,
          '/' + clean + '/index.html',
          '/' + last + '.html',
          '/index.html'
        ];

        var unique = [];
        for (var i = 0; i < candidates.length; i++) {
          if (unique.indexOf(candidates[i]) === -1) unique.push(candidates[i]);
        }

        var result = null;
        for (var j = 0; j < unique.length; j++) {
          var u = unique[j];
          logStep('TRY', u, 'info');
          var exists = await fileExists(u);
          if (exists) {
            result = u;
            logStep('HIT', '✅ ' + u, 'ok');
            break;
          } else {
            logStep('MISS', '❌ ' + u, 'err');
          }
        }

        cacheSet(rawPath, result);
        return result;
      }

      function logStep(step, message, type) {
        type = type || 'info';
        var logEl = document.getElementById('networkLog');
        if (!logEl) return;
        var line = document.createElement('div');
        line.className = 'log-line ' + type;
        line.textContent = (step ? '[' + step + '] ' : '') + message;
        logEl.appendChild(line);
        while (logEl.children.length > CONFIG.maxLogLines + 1) {
          logEl.removeChild(logEl.children[1]);
        }
        logEl.scrollTop = logEl.scrollHeight;
      }

      function updateResult(text, cls) {
        var el = document.getElementById('ovResult');
        if (!el) return;
        el.textContent = text;
        el.className = 'box-value';
        if (cls) el.classList.add(cls);
      }

      function updateStatsBar() {
        var s = window.__jabriNetStats;
        var ms = Math.round(performance.now() - s.startTime);
        var el;
        if ((el = document.getElementById('statNet'))) el.textContent = s.total;
        if ((el = document.getElementById('statOk')))  el.textContent = s.ok;
        if ((el = document.getElementById('statErr'))) el.textContent = s.err;
        if ((el = document.getElementById('statCache'))) el.textContent = s.cache;
        if ((el = document.getElementById('statMs')))  el.textContent = ms;
      }

      window.exitPage = function() {
        logStep('EXIT', 'User chose to exit', 'warn');
        try { window.close(); } catch (e) {}
        setTimeout(function() { try { window.history.back(); } catch (e) {} }, 200);
        setTimeout(function() { window.location.href = 'about:blank'; }, 600);
        setTimeout(function() { window.location.href = '/'; }, 1200);
      };

      async function handle404Redirect() {
        var path = location.pathname;
        var targetEl = document.getElementById('ovTarget');

        logStep('1/4', 'Starting 404 handler', 'step');
        logStep('1/4', 'Path: ' + path, 'info');
        updateResult('🔍 Resolving...', 'info');

        var resolved = await resolveFile(path);

        if (resolved && resolved !== path) {
          if (targetEl) targetEl.textContent = resolved;
          logStep('2/4', '✅ Resolved → ' + resolved, 'ok');
          logStep('3/4', 'Redirecting in 1.2s...', 'ok');
          updateResult('✅ FOUND → ' + resolved, 'ok');
          setTimeout(function() { window.location.href = resolved; }, 1200);
          return;
        }

        if (targetEl) targetEl.textContent = CONFIG.allLinksPath;
        logStep('2/4', '❌ Not resolved', 'err');
        logStep('3/4', 'Fallback → ' + CONFIG.allLinksPath, 'warn');
        updateResult('❌ Fallback → /all-links.html', 'err');
        setTimeout(function() { window.location.href = CONFIG.allLinksPath; }, 1500);
      }

      var count = localStorage.getItem('jabriVisitorCount');
      count = count === null ? Math.floor(Math.random() * 80) + 20 : Number(count) + 1;
      localStorage.setItem('jabriVisitorCount', count);
      var vcEl = document.getElementById('visitorCount');
      if (vcEl) vcEl.textContent = count;

      var curEl = document.getElementById('ovCurrent');
      if (curEl) curEl.textContent = location.pathname;

      logStep('', '🚀 404.html v' + VERSION + ' standalone', 'ok');
      logStep('', 'Path: ' + location.pathname, 'info');
      updateStatsBar();

      var seconds = 7;
      var countdownEl = document.getElementById('ovCountdown');
      var countdownInterval = setInterval(function() {
        seconds--;
        if (countdownEl) countdownEl.textContent = '⏱️ ' + seconds + 's';
        if (seconds <= 0) clearInterval(countdownInterval);
      }, 1000);

      setInterval(updateStatsBar, 1000);
      setTimeout(handle404Redirect, CONFIG.autoTryAfter);

      window.__jabri = {
        version: VERSION,
        cache: _resolveCache,
        stats: window.__jabriNetStats,
        clearCache: function() {
          _resolveCache.clear();
          window.__jabriNetStats.cache = 0;
          updateStatsBar();
          logStep('API', 'Cache cleared', 'warn');
        }
      };

      console.log('🏝️ Jabri 404 v' + VERSION + ' standalone ready');
    })();
  </script>
</body>
</html>
