<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow">
  <title>404 — جاري البحث | واحة الجبري</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Cairo', 'Segoe UI', Tahoma, sans-serif;
      background: linear-gradient(145deg, #0b1a2e, #1a2f44);
      color: #f0e6d3;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 20px;
      direction: rtl;
    }

    .container {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(10px);
      padding: 35px 25px;
      border-radius: 30px;
      border: 1px solid rgba(255, 215, 150, 0.2);
      max-width: 520px;
      width: 100%;
      box-shadow: 0 30px 50px rgba(0,0,0,0.6);
    }

    h1 {
      font-size: 6rem;
      font-weight: 900;
      color: #b48b5a;
      text-shadow: 0 0 60px rgba(180,139,90,0.5);
      line-height: 1;
      margin-bottom: 10px;
    }

    .sub {
      font-size: 1.4rem;
      color: #f0e6d3;
      margin-bottom: 25px;
      line-height: 1.6;
    }

    .box {
      background: #0b1a2e;
      border: 1px solid #b48b5a;
      border-radius: 14px;
      padding: 12px 16px;
      margin: 10px 0;
      text-align: right;
    }

    .box-label {
      font-size: 0.75rem;
      color: #b48b5a;
      margin-bottom: 6px;
      font-weight: 700;
      letter-spacing: 1px;
    }

    .box-value {
      font-family: 'Courier New', monospace;
      font-size: 0.85rem;
      color: #6ae3ff;
      direction: ltr;
      text-align: left;
      word-break: break-all;
      padding: 6px 10px;
      background: rgba(106,227,255,0.05);
      border-radius: 6px;
      border: 1px solid rgba(106,227,255,0.2);
      min-height: 30px;
    }

    #ovResult { color: #ffd166; }
    #ovResult.ok  { color: #06d6a0; }
    #ovResult.err { color: #ff6b6b; }

    .network-log {
      background: #000;
      border: 1px solid #6ae3ff;
      border-radius: 12px;
      padding: 10px 14px;
      margin: 12px 0;
      max-height: 130px;
      overflow-y: auto;
      font-family: 'Courier New', monospace;
      font-size: 11px;
      text-align: left;
      direction: ltr;
    }
    .network-log-title {
      color: #6ae3ff;
      font-size: 10px;
      margin-bottom: 6px;
      padding-bottom: 5px;
      border-bottom: 1px solid rgba(106,227,255,0.3);
      font-weight: 700;
    }
    .log-line {
      padding: 2px 0;
      color: #8aa5b5;
      line-height: 1.5;
      word-break: break-all;
    }
    .log-line.info { color: #6ae3ff; }
    .log-line.ok   { color: #06d6a0; }
    .log-line.err  { color: #ff6b6b; }
    .log-line.warn { color: #ffd166; }

    .visitor-box {
      margin: 15px auto;
      background: linear-gradient(135deg, #b48b5a, #8b6a3f);
      color: #0a0a0f;
      border-radius: 40px;
      padding: 10px 22px;
      font-weight: 700;
      font-size: 1rem;
      display: inline-block;
    }
    .visitor-box span {
      color: #0a0a0f;
      font-weight: 900;
      font-size: 1.2rem;
    }

    .loader {
      margin: 15px auto;
      width: 40px;
      height: 40px;
      border: 4px solid #b48b5a;
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .ov-countdown {
      margin: 10px 0;
      font-size: 1rem;
      color: #6ae3ff;
      font-family: monospace;
      font-weight: 700;
    }

    .ov-options {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 20px;
    }
    .ov-btn {
      padding: 13px 10px;
      border: none;
      border-radius: 14px;
      font-size: 0.85rem;
      font-weight: 900;
      font-family: inherit;
      cursor: pointer;
      text-decoration: none;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: transform 0.2s ease;
    }
    .ov-btn:hover { transform: scale(1.05); }
    .ov-btn-map  { background: linear-gradient(135deg, #6ae3ff, #3aa0c4); color: #0a0a0f; }
    .ov-btn-home { background: linear-gradient(135deg, #ffd700, #f0a500); color: #0a0a0f; }
    .ov-btn-waha { background: linear-gradient(135deg, #06d6a0, #05b98a); color: #0a0a0f; }
    .ov-btn-exit { background: linear-gradient(135deg, #ff6b6b, #e85555); color: #fff; }

    .footer {
      margin-top: 20px;
      font-size: 0.85rem;
      color: #b48b5a;
    }
    .version {
      margin-top: 8px;
      font-size: 11px;
      color: #444;
      font-family: monospace;
    }

    @media (max-width: 500px) {
      h1 { font-size: 4.5rem; }
      .sub { font-size: 1.15rem; }
      .ov-btn { font-size: 0.75rem; padding: 12px 8px; }
    }
  </style>
</head>

<body data-waha-404="true">
  <div class="container">
    <h1>404</h1>
    <div class="sub">🏝️ عذرًا، هذا الدرب غير موجود</div>

    <div class="box">
      <div class="box-label">🔍 CURRENT PATH</div>
      <div class="box-value" id="pathDisplay">/</div>
    </div>

    <div class="box">
      <div class="box-label">➡️ TARGET PATH</div>
      <div class="box-value" id="targetDisplay">—</div>
    </div>

    <div class="box">
      <div class="box-label">📊 RESULT</div>
      <div class="box-value" id="ovResult">🔍 Searching...</div>
    </div>

    <div class="network-log" id="networkLog">
      <div class="network-log-title">🌐 NETWORK LOG</div>
    </div>

    <div class="visitor-box">
      👥 عدد الزوار: <span id="visitorCount">1</span>
    </div>

    <div class="loader"></div>

    <div class="ov-countdown" id="ovCountdown">⏱️ 7s</div>

    <div class="ov-options">
      <a href="/all-links.html" class="ov-btn ov-btn-map">🗺️ خريطة</a>
      <a href="/index.html" class="ov-btn ov-btn-home">🏠 افتتاح</a>
      <a href="/Page11.html" class="ov-btn ov-btn-waha">🏝️ الواحة</a>
      <button onclick="exitPage()" class="ov-btn ov-btn-exit">🚪 خروج</button>
    </div>

    <div class="footer">🏛️ من صنعاء إلى الكون 🇾🇪</div>
    <div class="version">v7.2.0</div>
  </div>

  <script>
    (function() {
      'use strict';

      var count = localStorage.getItem('jabriVisitorCount');
      count = count === null ? Math.floor(Math.random() * 80) + 20 : Number(count) + 1;
      localStorage.setItem('jabriVisitorCount', count);
      document.getElementById('visitorCount').textContent = count;

      document.getElementById('pathDisplay').textContent = location.pathname;

      var logEl = document.getElementById('networkLog');

      function logNet(msg, type) {
        type = type || 'info';
        var t = new Date().toTimeString().split(' ')[0];
        var line = document.createElement('div');
        line.className = 'log-line ' + type;
        line.textContent = '[' + t + '] ' + msg;
        logEl.appendChild(line);
        logEl.scrollTop = logEl.scrollHeight;
        console.log('🌐 ' + msg);
      }

      function fileExists(url) {
        logNet('GET ' + url, 'info');
        return fetch(url, {
          method: 'GET',
          cache: 'no-store',
          redirect: 'manual'
        })
        .then(function(res) {
          if (res.status >= 200 && res.status < 300) {
            logNet('  → ' + res.status + ' OK', 'ok');
            return true;
          } else {
            logNet('  → ' + res.status + ' NOT FOUND', 'err');
            return false;
          }
        })
        .catch(function(e) {
          logNet('  → Error: ' + e.message, 'err');
          return false;
        });
      }

      var resultEl = document.getElementById('ovResult');

      function updateResult(text, cls) {
        if (resultEl) {
          resultEl.textContent = text;
          resultEl.className = 'box-value';
          if (cls) resultEl.classList.add(cls);
        }
      }

      window.exitPage = function() {
        logNet('🚪 User chose EXIT', 'warn');
        try { window.close(); } catch (e) {}
        setTimeout(function() { try { window.history.back(); } catch (e) {} }, 200);
        setTimeout(function() { window.location.href = 'about:blank'; }, 600);
        setTimeout(function() { window.location.href = '/'; }, 1200);
      };

      async function handle404Redirect() {
        var path = location.pathname;
        var hasHtml = path.toLowerCase().endsWith('.html');
        var targetEl = document.getElementById('targetDisplay');

        logNet('━━━ 404 handler started ━━━', 'warn');

        if (!hasHtml) {
          var newPath = path + '.html';
          if (targetEl) targetEl.textContent = newPath;
          logNet('IF branch: adding .html', 'warn');
          updateResult('🔍 GET ' + newPath + ' ...', 'info');

          var exists = await fileExists(newPath);

          if (exists) {
            updateResult('✅ 200 OK → Redirecting', 'ok');
            logNet('✅ FOUND → ' + newPath, 'ok');
            setTimeout(function() { window.location.href = newPath; }, 1500);
          } else {
            updateResult('❌ 404 → fallback', 'err');
            logNet('❌ NOT FOUND → /all-links.html', 'err');
            setTimeout(function() { window.location.href = '/all-links.html'; }, 1500);
          }
          return;
        }

        var file = path.split('/').filter(Boolean).pop();
        var rootPath = '/' + file;
        if (targetEl) targetEl.textContent = rootPath;
        logNet('ELSE branch: path ends with .html', 'warn');
        updateResult('🔍 GET ' + rootPath + ' ...', 'info');

        var existsInRoot = await fileExists(rootPath);

        if (existsInRoot) {
          updateResult('✅ 200 OK (root) → Redirecting', 'ok');
          logNet('✅ FOUND in root', 'ok');
          setTimeout(function() { window.location.href = rootPath; }, 1500);
          return;
        }

        updateResult('❌ 404 (root) → fallback', 'err');
        logNet('❌ NOT FOUND in root → /all-links.html', 'err');
        setTimeout(function() { window.location.href = '/all-links.html'; }, 1500);
      }

      logNet('🚀 404 page loaded', 'ok');
      logNet('Current: ' + location.pathname, 'info');

      var seconds = 7;
      var countdownEl = document.getElementById('ovCountdown');
      var countdownInterval = setInterval(function() {
        seconds--;
        if (countdownEl) countdownEl.textContent = '⏱️ ' + seconds + 's';
        if (seconds <= 0) clearInterval(countdownInterval);
      }, 1000);

      setTimeout(function() {
        handle404Redirect();
      }, 3000);

    })();
  </script>

  <script src="/js/init-page-root.js"></script>

</body>
</html>
