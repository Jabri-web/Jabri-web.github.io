<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow">
  <title>404 — جاري البحث عن الصفحة | واحة الجبري</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(145deg, #0b1a2e, #1a2f44);
      color: #f0e6d3;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 20px;
    }
    .container {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(10px);
      padding: 50px 40px;
      border-radius: 40px;
      border: 1px solid rgba(255, 215, 150, 0.2);
      max-width: 600px;
      box-shadow: 0 30px 50px rgba(0,0,0,0.6);
      position: relative;
      z-index: 1;
    }
    h1 { font-size: 80px; color: #d4a373; margin-bottom: 10px; }
    .sub { font-size: 24px; color: #e9c9a9; }
    .visitor-box {
      margin: 25px 0;
      padding: 15px;
      background: rgba(0,0,0,0.3);
      border-radius: 60px;
      font-size: 22px;
      border: 1px solid #b48b5a;
      display: inline-block;
      padding: 10px 30px;
    }
    .visitor-box span { color: #f7d44a; font-weight: bold; }
    .path-display {
      margin: 15px 0;
      font-size: 13px;
      color: #8a7a6a;
      font-family: Consolas, monospace;
      direction: ltr;
      word-break: break-all;
    }
    .note {
      margin-top: 20px;
      font-size: 18px;
      color: #bbaa99;
    }
    .loader {
      margin: 30px auto 15px;
      width: 48px;
      height: 48px;
      border: 5px solid #b48b5a;
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .footer {
      margin-top: 30px;
      font-size: 14px;
      color: #8a7a6a;
    }
    .btn-home {
      display: inline-block;
      background: #d4a373;
      color: #0b1a2e;
      padding: 12px 30px;
      border-radius: 50px;
      text-decoration: none;
      font-weight: bold;
      transition: 0.3s;
      border: 2px solid #f7d44a;
      margin: 15px 0;
    }
    .btn-home:hover {
      transform: scale(1.05);
      background: #f7d44a;
      box-shadow: 0 0 30px rgba(215, 170, 70, 0.3);
    }
  </style>
</head>

<!-- ✅ علامة صريحة لـ init-page-root.js -->
<body data-waha-404="true">
  <div class="container">
    <h1>🌿 404</h1>
    <div class="sub">عذرًا.. هذا الدرب غير موجود</div>

    <div class="path-display" id="pathDisplay"></div>

    <div class="visitor-box">
      👥 عدد زوار الواحة: <span id="visitorCount">1</span>
    </div>

    <div class="loader"></div>
    <p style="margin-top:5px; font-size:15px; color:#bbaa88;">
      🔎 جارٍ البحث عن الصفحة الصحيحة...
    </p>

    <div class="note">
      سيتم تحويلك تلقائياً في ثوانٍ
    </div>

    <a href="/" class="btn-home">🏠 العودة إلى الواحة</a>

    <div class="footer">🏛️ من صنعاء إلى الكون 🇾🇪</div>
  </div>

  <!-- ✅ placeholders اختيارية -->
  <div id="header-placeholder" style="display:none"></div>
  <div id="footer-placeholder" style="display:none"></div>

  <!-- ✅ عداد الزوار -->
  <script>
    (function(){
      var count = localStorage.getItem('jabriVisitorCount');
      if (count === null) {
        count = Math.floor(Math.random() * 80) + 20;
      } else {
        count = Number(count) + 1;
      }
      localStorage.setItem('jabriVisitorCount', count);
      var el = document.getElementById('visitorCount');
      if (el) el.textContent = count;

      var pathEl = document.getElementById('pathDisplay');
      if (pathEl) pathEl.textContent = location.pathname + location.search;
    })();
  </script>

  <!-- ✅ الدرع المطلق — Smart 404 يتولى التحويل للصفحة الصحيحة -->
  <script src="/js/init-page-root.js"></script>

</body>
</html>
