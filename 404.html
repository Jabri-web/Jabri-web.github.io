<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow">
  <title>404 — جاري البحث | واحة الجبري</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Cairo', 'Segoe UI', Tahoma, sans-serif;
      background: linear-gradient(145deg, #0b1a2e, #1a2f44);
      color: #f0e6d3;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      direction: rtl;
    }
    .container {
      background: rgba(255,255,255,0.05);
      backdrop-filter: blur(10px);
      padding: 30px 22px;
      border-radius: 30px;
      border: 1px solid rgba(255,215,150,0.2);
      max-width: 560px;
      width: 100%;
      box-shadow: 0 30px 50px rgba(0,0,0,0.6);
      text-align: center;
    }
    h1 { font-size: 5.5rem; font-weight: 900; color: #b48b5a;
      text-shadow: 0 0 60px rgba(180,139,90,0.5); line-height: 1; margin-bottom: 8px; }
    .sub { font-size: 1.3rem; margin-bottom: 22px; line-height: 1.6; }
    .box { background: #0b1a2e; border: 1px solid #b48b5a;
      border-radius: 14px; padding: 10px 14px; margin: 8px 0; text-align: right; }
    .box-label { font-size: 0.72rem; color: #b48b5a; margin-bottom: 5px; font-weight: 700; letter-spacing: 1px; }
    .box-value { font-family: 'Courier New', monospace; font-size: 0.82rem;
      color: #6ae3ff; direction: ltr; text-align: left; word-break: break-all;
      padding: 6px 10px; background: rgba(106,227,255,0.05);
      border-radius: 6px; border: 1px solid rgba(106,227,255,0.2); min-height: 28px; }
    #ovResult.ok  { color: #06d6a0; }
    #ovResult.err { color: #ff6b6b; }
    .network-log { background: #000; border: 1px solid #6ae3ff;
      border-radius: 12px; padding: 10px 14px; margin: 12px 0;
      max-height: 200px; overflow-y: auto;
      font-family: monospace; font-size: 11px;
      text-align: left; direction: ltr; }
    .network-log-title { color: #6ae3ff; font-size: 10px; margin-bottom: 6px;
      padding-bottom: 5px; border-bottom: 1px solid rgba(106,227,255,0.3);
      font-weight: 700; }
    .log-line { padding: 3px 0; color: #8aa5b5; line-height: 1.5; word-break: break-all; }
    .log-line.ok { color: #06d6a0; }
    .log-line.err { color: #ff6b6b; }
    .log-line.warn { color: #ffd166; }
    .log-line.step { color: #b48b5a; font-weight: 700; }
    .visitor-box { margin: 14px auto;
      background: linear-gradient(135deg, #b48b5a, #8b6a3f);
      color: #0a0a0f; border-radius: 40px; padding: 9px 20px;
      font-weight: 700; font-size: 0.95rem; display: inline-block; }
    .visitor-box span { color: #0a0a0f; font-weight: 900; font-size: 1.15rem; }
    .loader { margin: 12px auto; width: 38px; height: 38px;
      border: 4px solid #b48b5a; border-top-color: transparent;
      border-radius: 50%; animation: spin404 0.9s linear infinite; }
    @keyframes spin404 { to { transform: rotate(360deg); } }
    .ov-countdown { margin: 8px 0; font-size: 0.95rem; color: #6ae3ff; font-family: monospace; font-weight: 700; }
    .stats-bar { display: flex; justify-content: space-around;
      background: rgba(106,227,255,0.05); border: 1px solid rgba(106,227,255,0.2);
      border-radius: 10px; padding: 8px; margin: 10px 0; font-family: monospace; font-size: 11px; }
    .stat-item { text-align: center; }
    .stat-num { color: #6ae3ff; font-weight: 900; font-size: 15px; display: block; }
    .stat-lbl { color: #8aa5b5; font-size: 9px; }
    .ov-options { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 18px; }
    .ov-btn { padding: 12px 10px; border: none; border-radius: 14px; font-size: 0.82rem; font-weight: 900; font-family: inherit; cursor: pointer; text-decoration: none; display: flex; align-items: center; justify-content: center; gap: 6px; transition: transform 0.2s ease; }
    .ov-btn:hover { transform: scale(1.05); }
    .ov-btn-map { background: linear-gradient(135deg, #6ae3ff, #3aa0c4); color: #0a0a0f; }
    .ov-btn-home { background: linear-gradient(135deg, #ffd700, #f0a500); color: #0a0a0f; }
    .ov-btn-waha { background: linear-gradient(135deg, #06d6a0, #05b98a); color: #0a0a0f; }
    .ov-btn-exit { background: linear-gradient(135deg, #ff6b6b, #e85555); color: #fff; }
    .footer { margin-top: 16px; font-size: 0.82rem; color: #b48b5a; }
    .version { margin-top: 6px; font-size: 11px; color: #444; font-family: monospace; }
  </style>
</head>
<body>
  <div class="container" id="jabri404Container">
    <h1>404</h1>
    <div class="sub">🏝️ عذرًا، هذا الدرب غير موجود</div>
    <div class="box"><div class="box-label">🔍 CURRENT PATH</div><div class="box-value" id="ovCurrent">—</div></div>
    <div class="box"><div class="box-label">➡️ TARGET PATH</div><div class="box-value" id="ovTarget">—</div></div>
    <div class="box"><div class="box-label">📊 RESULT</div><div class="box-value" id="ovResult">⏳ Initializing...</div></div>
    <div class="stats-bar">
      <div class="stat-item"><span class="stat-num" id="statNet">0</span><span class="stat-lbl">NET</span></div>
      <div class="stat-item"><span class="stat-num" id="statOk">0</span><span class="stat-lbl">OK</span></div>
      <div class="stat-item"><span class="stat-num" id="statErr">0</span><span class="stat-lbl">ERR</span></div>
      <div class="stat-item"><span class="stat-num" id="statCache">0</span><span class="stat-lbl">CACHE</span></div>
      <div class="stat-item"><span class="stat-num" id="statMs">0</span><span class="stat-lbl">MS</span></div>
    </div>
    <div class="network-log" id="networkLog"><div class="network-log-title">🌐 PROCESS LOG — file-all4.txt v5.4</div></div>
    <div class="visitor-box">👥 عدد الزوار: <span id="visitorCount">1</span></div>
    <div class="loader"></div>
    <div class="ov-countdown" id="ovCountdown">⏱️ 7s</div>
    <div class="ov-options">
      <a href="/all-links.html" class="ov-btn ov-btn-map">🗺️ خريطة</a>
      <a href="/index.html" class="ov-btn ov-btn-home">🏠 افتتاح</a>
      <a href="/Page11.html" class="ov-btn ov-btn-waha">🏝️ الواحة</a>
      <button onclick="exitPage()" class="ov-btn ov-btn-exit">🚪 خروج</button>
    </div>
    <div class="footer">🏛️ من صنعاء إلى الكون 🇾🇪</div>
    <div class="version">v8.3.8 — FIXED — file-all4.txt Beast</div>
  </div>

  <script>
    (function() {
      'use strict';
      // ✅ إصلاح الثغرة 1: لا تستخدم sessionHandled للصفحة البيضاء
      var hasInitRoot = !!window.Jabri || !!window.__JABRI_ROOT__ || !!window.__JABRI_MOUNTED__;
      if (hasInitRoot) {
        console.log('🛡️ [404.html] Yielding to init-page-root.js');
        document.getElementById('jabri404Container').style.display = 'none';
        window.__jabri404Delegated = true;
        return;
      }
      console.log('🚀 [404.html] Standalone v8.3.8');
      window.__jabri404Standalone = true;
    })();
  </script>

  <script>
    (function() {
      'use strict';
      if (window.__jabri404Delegated) return;

      var CONFIG = { allLinksPath: '/all-links.html', autoTryAfter: 800, maxLogLines: 100 };
      var VERSION = '8.3.8';
      window.__jabriNetStats = { total: 0, ok: 0, err: 0, cache: 0, startTime: performance.now() };

      function logStep(step, message, type) {
        var logEl = document.getElementById('networkLog');
        if (!logEl) return;
        var line = document.createElement('div');
        line.className = 'log-line ' + (type||'info');
        line.textContent = (step ? '['+step+'] ' : '') + message;
        logEl.appendChild(line);
        while (logEl.children.length > CONFIG.maxLogLines + 1) logEl.removeChild(logEl.children[1]);
        logEl.scrollTop = logEl.scrollHeight;
      }
      function updateResult(text, cls) {
        var el = document.getElementById('ovResult');
        if (!el) return;
        el.textContent = text;
        el.className = 'box-value ' + (cls||'');
      }
      function updateStatsBar() {
        var s = window.__jabriNetStats;
        var ms = Math.round(performance.now() - s.startTime);
        var e;
        if ((e=document.getElementById('statNet'))) e.textContent = s.total;
        if ((e=document.getElementById('statOk'))) e.textContent = s.ok;
        if ((e=document.getElementById('statErr'))) e.textContent = s.err;
        if ((e=document.getElementById('statCache'))) e.textContent = s.cache;
        if ((e=document.getElementById('statMs'))) e.textContent = ms;
      }
      window.exitPage = function() {
        try { window.close(); } catch(e){}
        setTimeout(function(){ try { history.back(); } catch(e){} }, 200);
        setTimeout(function(){ location.href='about:blank'; }, 600);
        setTimeout(function(){ location.href='/'; }, 1200);
      };

      var FILE_LIST = null;
      var EXCLUDED = /^(404|dashboard|dashboard-pro|catalog|header|footer|hero|offline)\.html$/i;

      async function loadFileList() {
        if (FILE_LIST) return FILE_LIST;
        try {
          logStep('LIST', 'Loading file-all4.txt v5.4...', 'step');
          var res = await fetch('/file-all4.txt?v='+Date.now(), {cache:'no-store'});
          var txt = await res.text();
          var lines = txt.split('\n')
            .map(function(s){ return s.trim(); })
            .filter(function(s){ return s && !s.startsWith('#') && s.includes('.html') && !s.includes('⛔'); })
            .map(function(s){ return s.replace(/^\d+\.\s*/, '').replace(/^\s*[-*]\s*/, '').trim().split(' ')[0]; })
            .filter(function(s){ return s.endsWith('.html'); })
            .filter(function(s){ return !EXCLUDED.test(s.split('/').pop()); })
            .filter(function(s){ return !s.startsWith('ar/') && !s.startsWith('en/') || true; }); // احتفظ بـ ar/en لكن لا تكرر

          var uniq = [];
          lines.forEach(function(l){ if(uniq.indexOf(l)===-1) uniq.push(l); });
          
          FILE_LIST = uniq;
          window.__jabriNetStats.total++; window.__jabriNetStats.ok++; window.__jabriNetStats.cache = uniq.length;
          updateStatsBar();
          logStep('LIST', '✅ Loaded '+uniq.length+' files (excluded ⛔ + 404/dashboard/catalog)', 'ok');
          return FILE_LIST;
        } catch (e) {
          logStep('LIST', '❌ Failed: '+e.message, 'err');
          window.__jabriNetStats.err++;
          return [];
        }
      }

      async function resolveFile(rawPath) {
        // ✅ إصلاح الثغرة 2: فلترة الوسائط + الأنظمة
        if (/\.(mp3|mp4|png|webp|jpg|jpeg|ico|pdf|csv|zip|js|css|mp3)$/i.test(rawPath)) {
          logStep('SKIP', 'Media/System → 404 pure: '+rawPath, 'warn');
          return null;
        }
        var list = await loadFileList();
        if (!list.length) return null;

        var clean = rawPath.replace(/^\/+|\/+$/g, '').toLowerCase();
        if (!clean) return '/index.html';
        var last = clean.split('/').pop().replace('.html','').toLowerCase();
        if (!last) return '/index.html';

        logStep('RESOLVE', 'Searching: '+last, 'step');

        var found = null;
        // 1- تطابق تام
        found = list.find(function(f){ var lf=f.toLowerCase(); return lf===clean || lf===clean+'.html' || lf===''+clean; });
        // 2- يطابق /Page11.html
        if (!found) found = list.find(function(f){ return f.toLowerCase().endsWith('/'+last+'.html') || f.toLowerCase()===last+'.html'; });
        
        // ✅ إصلاح الثغرة 3: لا indexOf عشوائي — ≥4 أحرف + startsWith
        if (!found && last.length >= 4) {
          found = list.find(function(f){
            var base = f.toLowerCase().split('/').pop().replace('.html','');
            return base.startsWith(last) || last.startsWith(base);
          });
        }

        if (found) {
          var path = '/' + found.replace(/^\/+/, '');
          logStep('HIT', '✅ '+path, 'ok');
          return path;
        }
        logStep('MISS', '❌ Not in file-all4.txt', 'err');
        return null;
      }

      async function handle404Redirect() {
        var path = location.pathname;
        var targetEl = document.getElementById('ovTarget');
        logStep('1/3', 'Handler v8.3.8', 'step');
        logStep('1/3', 'Path: '+path, 'info');
        updateResult('🔍 Searching in file-all4.txt...', '');

        var resolved = await resolveFile(path);
        if (resolved && resolved.toLowerCase() !== path.toLowerCase()) {
          if (targetEl) targetEl.textContent = resolved;
          logStep('2/3', '✅ → '+resolved, 'ok');
          updateResult('✅ FOUND → '+resolved, 'ok');
          setTimeout(function(){ location.href = resolved; }, 1200);
          return;
        }
        if (targetEl) targetEl.textContent = CONFIG.allLinksPath;
        logStep('2/3', 'Fallback → '+CONFIG.allLinksPath, 'warn');
        updateResult('❌ Fallback → /all-links.html', 'err');
        setTimeout(function(){ location.href = CONFIG.allLinksPath; }, 1500);
      }

      var count = localStorage.getItem('jabriVisitorCount');
      count = count===null ? Math.floor(Math.random()*80)+20 : Number(count)+1;
      localStorage.setItem('jabriVisitorCount', count);
      document.getElementById('visitorCount').textContent = count;
      document.getElementById('ovCurrent').textContent = location.pathname;

      logStep('', '🚀 404 v'+VERSION+' FIXED — file-all4.txt Beast', 'ok');
      updateStatsBar();

      var seconds = 7;
      var countdownEl = document.getElementById('ovCountdown');
      var iv = setInterval(function(){ seconds--; if(countdownEl) countdownEl.textContent='⏱️ '+seconds+'s'; if(seconds<=0) clearInterval(iv); }, 1000);
      setInterval(updateStatsBar, 1000);
      setTimeout(handle404Redirect, CONFIG.autoTryAfter);
      console.log('🏝️ Jabri 404 v'+VERSION+' FIXED ready');
    })();
  </script>
</body>
</html>
