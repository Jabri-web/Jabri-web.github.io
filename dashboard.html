  .lang-btn:hover { background: #4dd4ff; }
  html[lang="ar"] .en { display:none } 
  html[lang="en"] .ar { display:none }

<button class="lang-btn" onclick="toggleLang()">
  <span class="ar">EN</span>
  <span class="en">عربي</span>
</button>

<script>
function toggleLang(){
  const path = location.pathname;
  const qs = location.search + location.hash;
  // شيل /ar/ او /en/ من البداية
  const pure = path.replace(/^\/(ar|en)(\/|$)/i, '/').replace(/^\/+/, '');
  const file = pure || 'all-links.html'; // لو في الروت

  const lower = path.toLowerCase();
  if(lower.startsWith('/en/') || lower === '/en'){
    location.href = '/ar/' + file + qs;
  } else if(lower.startsWith('/ar/') || lower === '/ar'){
    location.href = '/en/' + file + qs;
  } else {
    // انت في /catalog.html -> روح للعكس حسب لغة المتصفح
    const goEn = document.documentElement.lang === 'ar';
    location.href = (goEn ? '/en/' : '/ar/') + file + qs;
  }
}
// نفس الاسم القديم عشان ما ينكسر v12.1
window.switchLanguage = window.toggleLanguage = toggleLang;
</script>
