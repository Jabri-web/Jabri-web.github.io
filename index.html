html, body {

body {
  font-family: Tahoma, Arial, sans-serif;
  color: #000;
  display: flex;
  align-items: flex-start;
  justify-content: center;
  padding: 20px 0 80px 0;
  box-sizing: border-box;
  overflow-y: auto;
  text-align: center;
}
.container {
  width: 90%;

.top-line {
  display: flex;

}
.eye {
  font-size: 28px;
}
h1 {
  font-size: 28px;

.yemen-title {
  font-size: 24px;

.sub-ar {

/* صورة الطير + النبض */
.bird-img {
  width: 120px;
  height: 120px;
  border-radius: 50%;
  object-fit: cover;
  margin: 15px auto;
  border: 3px solid #000;
  display: block;
  transition: transform 0.6s ease-in-out;
  animation: pulse 2s infinite ease-in-out;
}
@keyframes pulse {
 0%, 100% { transform: scale(1); }
 50% { transform: scale(var(--scale, 1.15)); }
}

.btn {
  display: flex;
  justify-content: space-between;
  align-items: center;
  width: 100%;
  margin: 14px 0;
  padding: 18px;
  background: #000;
  color: #fff;
  text-decoration: none;
  font-size: 18px;
  font-weight: bold;
  border-radius: 15px;
  box-sizing: border-box;
  transition: 0.2s;
}
.btn:active {
  transform: scale(0.98);
  background: #333;
}
.btn-exit {
  background: #c62828;
  border: none;
  cursor: pointer;
  font-family: inherit;
}
.btn-exit:active {
  background: #b71c1c;
}
</style>
