<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sindbad Yemen</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Naskh+Arabic:wght@400;700&display=swap" rel="stylesheet">
<style>
html, body {
  height: 100%;
  margin: 0;
  padding: 0;
  background: #fff;
}

body {
  font-family: 'Noto Naskh Arabic', Tahoma, Arial, sans-serif;
  color: #000;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  align-items: center;
  padding: 20px;
  box-sizing: border-box;
}

.header {
  text-align: center;
  margin-top: 20px;
}

h1 {
  font-size: 32px;
  margin: 0 0 5px 0;
  font-weight: bold;
}

.eye {
  font-size: 28px;
  vertical-align: middle;
}

.sub-ar {
  font-size: 20px;
  margin-bottom: 5px;
  font-weight: bold;
}

.sub-en {
  font-size: 16px;
  margin-bottom: 30px;
  color: #555;
}

.container {
  width: 90%;
  max-width: 500px;
  text-align: center;
}

.btn {
  display: block;
  width: 100%;
  margin: 14px 0;
  padding: 18px;
  background: #000;
  color: #fff;
  text-decoration: none;
  font-size: 18px;
  font-weight: bold;
  border-radius: 15px;
  box-sizing: border-box;
  transition: 0.2s;
}

.btn:hover {
  background: #333;
}

.footer {
  width: 90%;
  max-width: 500px;
  display: flex;
  justify-content: space-between;
  font-size: 16px;
  margin-bottom: 20px;
}
</style>
</head>
<body>

<div class="header">
  <h1><span class="eye">👁️</span> سندباد اليمن</h1>
  <div style="font-size: 26px; margin-bottom: 10px;">Yemen Sindbad</div>
  <div class="sub-ar">م/عبدالله الجبري</div>
  <div class="sub-en">Eng. Abdulla Al-Jabri</div>
</div>

<div class="container">
  <a class="btn" href="Page1.index">سندباد اليمن &nbsp;&nbsp;&nbsp; Yemen Sindbad</a>
  <a class="btn" href="Page2.index">طائر اليمن &nbsp;&nbsp;&nbsp; Yemen Bird</a>
  <a class="btn" href="Page3.index">عنكبوت-اليمن &nbsp;&nbsp;&nbsp; Yemen Ankaboot</a>
  <a class="btn" href="Page4.index">صفحات وبحوث &nbsp;&nbsp;&nbsp; Pages & Researches</a>
</div>

<div class="footer">
  <span>الوقت: <span id="time"></span></span>
  <span>التاريخ: <span id="date"></span></span>
</div>

<script>
function updateTime() {
  const now = new Date();
  document.getElementById('time').innerText = now.toLocaleTimeString('ar-SA');
  document.getElementById('date').innerText = now.toLocaleDateString('ar-SA');
}
updateTime();
setInterval(updateTime, 1000);
</script>

</body>
</html>
