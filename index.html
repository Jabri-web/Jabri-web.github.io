<style>
:root{
  --container-width: 500px;
}

html, body { 
  height: 100%; 
  margin: 0; 
  padding: 0; 
  background: #fff; 
}

body {
  font-family: Tahoma, Arial, sans-serif;
  color: #000;
  display: flex;
  align-items: flex-start;
  justify-content: center;
  padding: 20px 0 80px 0;
  box-sizing: border-box;
  overflow-y: auto;
}

.container {
  width: var(--container-width);
  max-width: 500px;
  text-align: center;
  padding: 0 20px 20px 20px;
}

.top-line {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  margin-bottom: 5px;
}

.eye { font-size: 28px; }

h1 {
  font-size: 28px;
  margin: 0;
  font-weight: bold;
}

.sub-ar {
  font-size: 20px;
  margin: 10px 0 5px 0;
  font-weight: bold;
}

.sub-en {
  font-size: 16px;
  margin-bottom: 35px;
  color: #555;
}

/* صورة الطير + النبض */
.bird-img {
  width: 120px;
  height: 120px;
  border-radius: 50%;
  object-fit: cover;
  margin: 15px auto 35px auto;
  border: 3px solid #000;
  display: block;
  transition: transform 0.6s ease-in-out;
  animation: pulse 2s infinite ease-in-out;
}
@keyframes pulse {
 0%, 100% { transform: scale(1); }
 50% { transform: scale(var(--scale, 1.15)); }
}

.btn {
  display: flex;
  justify-content: space-between;
  align-items: center;
  width: 100%;
  margin: 14px 0;
  padding: 18px;
  background: #000;
  color: #fff;
  text-decoration: none;
  font-size: 18px;
  font-weight: bold;
  border-radius: 15px;
  box-sizing: border-box;
  transition: 0.2s;
}

.btn:active {
  transform: scale(0.98);
  background: #333;
}

.btn-exit {
  background: #c62828;
  border: none;
  cursor: pointer;
  font-family: inherit;
}

.btn-exit:active {
  background: #b71c1c;
}

/* صندوق المعلومات التاريخ والوقت */
.info-box {
  margin-top: 2vh;
  padding: 2vh;
  background: white;
  border-radius: 12px;
  text-align: right;
  font-size: 16px;
  color: #333;
  line-height: 1.8;
  border: 1px solid #ddd;
  box-sizing: border-box;
}
.info-box b {
  color: #0a3d62;
}
</style>

<script>
// جس نبض الشاشة + الطير
function adjustScreen(){
  const screenWidth = window.innerWidth;
  
  let containerWidth = screenWidth - 40;
  if(containerWidth > 500) containerWidth = 500;
  if(containerWidth < 320) containerWidth = 320;
  
  document.documentElement.style.setProperty('--container-width', containerWidth + 'px');

  // نبض الطير حسب المقاس
  const bird = document.querySelector('.bird-img');
  if(bird) {
    let scale = 1.1;
    if (screenWidth < 400) scale = 1.25;
    else if (screenWidth < 768) scale = 1.18;
    else scale = 1.12;
    bird.style.setProperty('--scale', scale);
  }
}

// التاريخ والوقت
function updateTime(){
  const now = new Date();
  document.getElementById('date').innerText = now.toLocaleDateString('ar-EG');
  document.getElementById('time').innerText = now.toLocaleTimeString('ar-EG');
}

window.onload = function() {
  adjustScreen();
  updateTime();
  setInterval(updateTime, 1000); // يتحدث كل ثانية
}

window.onresize = adjustScreen;
</script>
</head>
