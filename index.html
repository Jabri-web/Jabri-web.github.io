function adjustScreen(){
  const screenWidth = window.innerWidth;
  
  // عرض الحاوية = الشاشة - 40px عشان الهوامش

}

window.onload = function() {
  adjustScreen(); // نقرأ المقاس أول ما تفتح
}

window.onresize = adjustScreen; // لو قلبت الجوال
