<script>
(function() {
  const VERSION = '2.8.0';
  if (localStorage.getItem('jabri_version') !== VERSION) {
    localStorage.clear();
    localStorage.setItem('jabri_version', VERSION);
    console.log('🔄 نسخة ' + VERSION);
  }
})();

(function initMusic() {
  const music = document.getElementById('bgMusic');
  const btn = document.getElementById('musicBtn');
  if (!music || !btn) return;
  let isPlaying = false;
  music.volume = 0.3;
  btn.addEventListener('click', function() {
    if (isPlaying) {
      music.pause();
      this.innerHTML = '🎵';
      this.classList.remove('playing');
      isPlaying = false;
      localStorage.setItem('jabri_music_state', 'paused');
    } else {
      music.play().then(() => {
        this.innerHTML = '🔇';
        this.classList.add('playing');
        isPlaying = true;
        localStorage.setItem('jabri_music_state', 'playing');
      }).catch(function(e) {
        document.addEventListener('click', function playOnClick() {
          music.play().then(() => {
            btn.innerHTML = '🔇';
            btn.classList.add('playing');
            isPlaying = true;
            localStorage.setItem('jabri_music_state', 'playing');
          }).catch(() => {});
          document.removeEventListener('click', playOnClick);
        }, { once: true });
      });
    }
  });
  setTimeout(function() {
    if (localStorage.getItem('jabri_music_state') === 'playing') {
      music.play().then(() => {
        btn.innerHTML = '🔇';
        btn.classList.add('playing');
        isPlaying = true;
      }).catch(() => {});
    }
  }, 500);
})();

(function initCounter() {
  let count = parseInt(localStorage.getItem('jabri_visitor_count') || '0', 10);
  count += 1;
  localStorage.setItem('jabri_visitor_count', count);
  const display = document.getElementById('visitorCount');
  const textEl = document.getElementById('visitorText');
  if (display) display.innerText = count.toLocaleString('ar-EG');
  function updateLang() {
    if (!textEl) return;
    const lang = document.documentElement.lang || 'ar';
    textEl.innerText = lang === 'ar' ? 'زوار' : 'Visitors';
  }
  updateLang();
  window.updateCounterLang = updateLang;
})();

(function initLang() {
  const btn = document.getElementById('langBtn');
  if (!btn) return;
  const preferred = localStorage.getItem('preferred-language');
  const browserLang = navigator.language || navigator.userLanguage;
  const isArabic = preferred === 'ar' || (preferred === null && browserLang.startsWith('ar'));
  if (isArabic) {
    document.documentElement.lang = 'ar';
    document.documentElement.dir = 'rtl';
    btn.textContent = '🇾🇪 عربي';
  } else {
    document.documentElement.lang = 'en';
    document.documentElement.dir = 'ltr';
    btn.textContent = '🇬🇧 English';
  }
  if (window.updateCounterLang) window.updateCounterLang();
  btn.addEventListener('click', function() {
    const isAr = document.documentElement.lang === 'ar';
    const newLang = isAr ? 'en' : 'ar';
    document.documentElement.lang = newLang;
    document.documentElement.dir = newLang === 'ar' ? 'rtl' : 'ltr';
    localStorage.setItem('preferred-language', newLang);
    this.textContent = newLang === 'ar' ? '🇾🇪 عربي ' : '🇬🇧 English';
    if (window.updateCounterLang) window.updateCounterLang();
    console.log('🌍 اللغة: ' + newLang);
  });
})();

console.log('✅ header.html جاهز - مفهرس بالكامل مع WebPage و BreadcrumbList');
</script>
