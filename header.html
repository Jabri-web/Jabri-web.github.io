    <!-- ===== سكريبتات التشغيل ===== -->
    <script>
        // ============================================================
        //  توحيد الدوال العامة (window.)
        // ============================================================

        // 1. تبديل اللغة - متوافقة مع كلا الزرين (عربي/English)
        window.toggleLang = function() {
            document.body.classList.toggle('en');
            const isEn = document.body.classList.contains('en');
            document.documentElement.dir = isEn ? 'ltr' : 'rtl';
            document.documentElement.lang = isEn ? 'en' : 'ar';
            localStorage.setItem('lang', isEn ? 'en' : 'ar');
            updateFooterLang();
            updateVisitorUI();
            updateLangUI();
        };

        // 2. تشغيل/إيقاف الموسيقى
        window.toggleMusic = function() {
            const audio = document.getElementById('oasisMusic');
            if (!audio) return;
            const btns = document.querySelectorAll('#musicTopBtn, #musicBottomBtn');
            if (audio.paused) {
                audio.play().catch(() => {});
                btns.forEach(b => { b.textContent = '🔊'; b.classList.add('playing'); });
            } else {
                audio.pause();
                btns.forEach(b => { b.textContent = '🎵'; b.classList.remove('playing'); });
            }
        };

        // 3. فتح/إغلاق المحادثة
        window.toggleChat = function() {
            const box = document.getElementById('chatBox');
            if (box) {
                box.style.display = box.style.display === 'block' ? 'none' : 'block';
            }
        };

        // 4. فتح/إغلاق القائمة
        window.toggleMenu = function() {
            const menu = document.getElementById('main-menu');
            if (menu) {
                menu.style.display = menu.style.display === 'block' ? 'none' : 'block';
            }
        };

        // 5. تحديث عداد الزوار
        window.updateVisitorUI = function() {
            let count = parseInt(localStorage.getItem('jabri_visitor_count') || '0', 10);
            count += 1;
            localStorage.setItem('jabri_visitor_count', count);
            const formatted = count.toLocaleString('ar-EG');
            ['visitorCountTop', 'visitorCountBottom'].forEach(id => {
                const el = document.getElementById(id);
                if (el) el.textContent = formatted;
            });
        };

        // 6. تحديث واجهة اللغة - تعمل مع الزرين العلوي والسفلي
        window.updateLangUI = function() {
            const isEn = document.body.classList.contains('en');
            // الزر العلوي
            const topBtn = document.getElementById('langTopBtn');
            if (topBtn) {
                topBtn.innerHTML = isEn ?
                    '<span class="ar">🇾🇪 عربي</span><span class="en">🇬🇧 EN</span>' :
                    '<span class="ar">🇾🇪 عربي</span><span class="en">🇬🇧 EN</span>';
            }
            // الزر السفلي
            const bottomBtn = document.getElementById('langBottomBtn');
            if (bottomBtn) {
                bottomBtn.innerHTML = isEn ?
                    '<span class="ar">🇾🇪 عربي</span><span class="en">🇬🇧 English</span>' :
                    '<span class="ar">🇾🇪 عربي</span><span class="en">🇬🇧 English</span>';
            }
        };

        // 7. تحديث الفوتر (من init-page-root.js)
        window.updateFooterLang = function() {
            const isEn = document.body.classList.contains('en');
            const footer = document.getElementById('site-footer');
            if (footer) footer.dir = isEn ? 'ltr' : 'rtl';
            // باقي التحديثات موجودة في init-page-root.js
        };

        // ===== دالة إرسال المحادثة =====
        window.sendChat = function() {
            const input = document.getElementById('chatInput');
            if (input && input.value.trim()) {
                alert('✅ تم إرسال رسالتك: ' + input.value);
                input.value = '';
                document.getElementById('chatBox').style.display = 'none';
            }
        };

        // ============================================================
        //  تشغيل كل شيء عند تحميل الصفحة
        // ============================================================
        document.addEventListener('DOMContentLoaded', function() {
            // استعادة اللغة
            const savedLang = localStorage.getItem('lang') || 'ar';
            if (savedLang === 'en') {
                document.body.classList.add('en');
                document.documentElement.dir = 'ltr';
                document.documentElement.lang = 'en';
            } else {
                document.body.classList.remove('en');
                document.documentElement.dir = 'rtl';
                document.documentElement.lang = 'ar';
            }
            
            // تحديث عداد الزوار
            window.updateVisitorUI();
            
            // تحديث واجهة اللغة
            window.updateLangUI();
            
            console.log('✅ الهيدر جاهز - جميع الأزرار الذهبية شغالة');
            console.log('🧠 Z + C + A = 1 · نظرية السندباد الموحدة');
            console.log('🇾🇪 من صنعاء إلى الكون');
        });
    </script>

    <!-- ===== نداء القائمة فقط ===== -->
    <script src="../js/menu.js"></script>

    <!-- ===== الفوتر ===== -->
    <div id="footer-placeholder"></div>

    <!-- ===== صندوق المحادثة ===== -->
    <div id="chatBox" style="display:none; position:fixed; bottom:100px; right:20px; width:300px; background:#1a1a2e; border:2px solid #ffd700; border-radius:12px; padding:20px; z-index:9999;">
        <h3 style="color:#ffd700; text-align:center; margin-bottom:10px;">💬 المحادثة</h3>
        <textarea id="chatInput" placeholder="اكتب رسالتك..." style="width:100%; height:80px; background:#0a0a0f; border:1px solid #2a2a3e; color:#fff; border-radius:6px; padding:10px; margin-bottom:10px;"></textarea>
        <button onclick="window.sendChat()" style="width:100%; background:linear-gradient(135deg,#ffd700,#f0a500); color:#0a0a0f; border:none; padding:10px; border-radius:6px; font-weight:700; cursor:pointer;">📤 إرسال</button>
    </div>

</body>
</html>
