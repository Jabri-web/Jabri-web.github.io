<script>
(function(){
    if (window.__headerLoaded) return;
    window.__headerLoaded = true;

    let isPlaying = false;
    let currentUser = null;

    // ===== اللغة =====
    window.toggleLang = function() {
        const isAr = document.documentElement.lang === 'ar' || document.documentElement.dir === 'rtl';
        const newLang = isAr ? 'en' : 'ar';
        localStorage.setItem('preferred-lang', newLang);
        window.location.href = newLang === 'en' ? '/en/' : '/';
    };

    // ===== القائمة =====
    window.toggleMenu = function() {
        const menu = document.getElementById('sideMenu');
        const overlay = document.getElementById('menuOverlay');
        if(!menu) return;
        menu.classList.toggle('open');
        overlay.classList.toggle('active');
        document.body.style.overflow = menu.classList.contains('open') ? 'hidden' : '';
    };
    window.closeMenu = function() {
        const menu = document.getElementById('sideMenu');
        const overlay = document.getElementById('menuOverlay');
        if(menu) menu.classList.remove('open');
        if(overlay) overlay.classList.remove('active');
        document.body.style.overflow = '';
    };

    // ===== الإعدادات =====
    window.openSettings = function(){ 
        const el = document.getElementById('settingsOverlay');
        if(el) el.classList.add('active'); 
    };
    window.closeSettings = function(){ 
        const el = document.getElementById('settingsOverlay');
        if(el) el.classList.remove('active'); 
    };
    window.setMode = function(mode){
        document.body.classList.remove('night', 'day');
        document.body.classList.add(mode);
        localStorage.setItem('theme-mode', mode);
        document.querySelectorAll('.btn-setting').forEach(b=>b.classList.remove('active'));
        const btn = document.getElementById(mode+'Btn'); 
        if(btn) btn.classList.add('active');
        window.closeSettings();
    };

    // ===== تسجيل الدخول =====
    window.openLoginModal = function(){ 
        const el = document.getElementById('loginModal');
        if(el) el.classList.add('active'); 
    };
    window.closeLoginModalFn = function(){ 
        const el = document.getElementById('loginModal');
        if(el) el.classList.remove('active'); 
    };
    window.googleLogin = function(){ alert('🚧 جاري تطوير ميزة Google'); };
    window.localLogin = function(){
        const u = document.getElementById('localUsername').value.trim();
        const p = document.getElementById('localPassword').value.trim();
        if(u==='admin' && p==='123456'){
            currentUser={name:'مدير النظام',role:'admin'};
            document.getElementById('userStatus').style.display='block';
            document.getElementById('userNameText').textContent='👤 '+currentUser.name;
            document.getElementById('userRoleText').textContent='🔑 مدير';
            document.getElementById('logoutBtn').style.display='block';
            document.getElementById('loginOptions').style.display='none';
            document.getElementById('localLoginForm').classList.remove('active');
            window.closeLoginModalFn();
        } else { alert('❌ بيانات خاطئة'); }
    };
    window.logout = function(){
        currentUser=null;
        document.getElementById('userStatus').style.display='none';
        document.getElementById('logoutBtn').style.display='none';
        document.getElementById('loginOptions').style.display='block';
        window.closeLoginModalFn();
    };

    // ===== الموسيقى =====
    window.toggleMusic = function(){
        const audio=document.getElementById('bgMusic');
        const btn=document.getElementById('musicBottomBtn');
        if(!audio) return;
        if(isPlaying){ audio.pause(); btn.classList.remove('playing'); btn.textContent='🎵'; }
        else{ audio.play().catch(()=>{}); btn.classList.add('playing'); btn.textContent='⏸️'; }
        isPlaying=!isPlaying;
    };
    window.toggleChat = function(){ alert('💬 المحادثة قيد التطوير'); };

    // ===== Escape =====
    document.addEventListener('keydown', e=>{
        if(e.key==='Escape'){ 
            window.closeMenu(); 
            window.closeSettings(); 
            window.closeLoginModalFn(); 
        }
    });

    // ===== استعادة الوضع =====
    const savedMode = localStorage.getItem('theme-mode') || 'night';
    document.body.classList.remove('night', 'day');
    document.body.classList.add(savedMode);

    console.log('🌊 واحة الجبري - header.html تم تحميله بنجاح');
})();
</script>
