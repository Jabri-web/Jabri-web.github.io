    .bottom-buttons {

        .bottom-btn.music { font-size: 15px; min-width: 60px; padding: 0 10px; }
    }

  <script>
    // ===== دوال النوافذ العامة =====
    window.toggleLang = function() {
      const current = document.body.classList.contains('en') ? 'en' : 'ar';
      const next = current === 'ar' ? 'en' : 'ar';
      document.body.classList.toggle('en', next === 'en');
      document.documentElement.dir = next === 'en' ? 'ltr' : 'rtl';
      document.documentElement.lang = next === 'en' ? 'en' : 'ar';
      localStorage.setItem('lang', next);
      const langTop = document.getElementById('langTopBtn');
      const langBottom = document.getElementById('langBottomBtn');
      if (langTop) langTop.innerHTML = next === 'en' ? '<span class="ar">🇾🇪 عربي</span><span class="en">🇬🇧 EN</span>' : '<span class="ar">🇾🇪 عربي</span><span class="en">🇬🇧 EN</span>';
      if (langBottom) langBottom.innerHTML = next === 'en' ? '<span class="ar">🇾🇪 عربي</span><span class="en">🇬🇧 EN</span>' : '<span class="ar">🇾🇪 عربي</span><span class="en">🇬🇧 EN</span>';
    };

    window.toggleMusic = function() {
      const audio = document.getElementById('oasisMusic');
      if (!audio) return;
      const btns = document.querySelectorAll('.bottom-btn.music, .menu-btn [onclick*="toggleMusic"]');
      if (audio.paused) {
        audio.play().catch(() => {});
        btns.forEach(b => { if (b) { b.textContent = '🔊'; b.classList.add('playing'); } });
        document.getElementById('musicBottomBtn').textContent = '🔊';
        document.getElementById('musicBottomBtn').classList.add('playing');
      } else {
        audio.pause();
        btns.forEach(b => { if (b) { b.textContent = '🎵'; b.classList.remove('playing'); } });
        document.getElementById('musicBottomBtn').textContent = '🎵';
        document.getElementById('musicBottomBtn').classList.remove('playing');
      }
    };

    window.toggleChat = function() {
      alert('💬 المحادثة قيد التطوير... قريباً بإذن الله!\n\n📧 للتواصل: jabri62018@gmail.com');
    };

    window.toggleMenu = function() {
      const menu = document.getElementById('sideMenu');
      const overlay = document.getElementById('menuOverlay');
      if (menu && overlay) {
        menu.classList.toggle('open');
        overlay.classList.toggle('active');
      }
    };

    window.closeMenu = function() {
      const menu = document.getElementById('sideMenu');
      const overlay = document.getElementById('menuOverlay');
      if (menu) menu.classList.remove('open');
      if (overlay) overlay.classList.remove('active');
    };

    window.updateVisitorCount = function() {
      let count = parseInt(localStorage.getItem('jabri_visitor_count') || '0', 10);
      count += 1;
      localStorage.setItem('jabri_visitor_count', count);
      const bottomEl = document.getElementById('visitorCountBottom');
      if (bottomEl) bottomEl.textContent = count;
    };

    // ===== تشغيل الصوت تلقائياً بأول تفاعل =====
    (function() {
      const audio = document.getElementById('oasisMusic');
      if (!audio) return;
      let musicPlayed = false;

      function playMusic() {
        if (musicPlayed) return;
        musicPlayed = true;
        document.removeEventListener('click', playMusic);
        document.removeEventListener('touchstart', playMusic);
        
        audio.volume = 1;
        audio.play().then(() => {
          const btn = document.getElementById('musicBottomBtn');
          if (btn) { btn.textContent = '🔊'; btn.classList.add('playing'); }
          console.log('🎵 تم تشغيل الموسيقى تلقائياً');
        }).catch(err => {
          musicPlayed = false;
          console.log('لم يتم تشغيل الصوت تلقائياً:', err);
        });
      }

      document.addEventListener('click', playMusic);
      document.addEventListener('touchstart', playMusic);
    })();

    // ===== تهيئة اللغة وعدد الزوار =====
    document.addEventListener('DOMContentLoaded', function() {
      const savedLang = localStorage.getItem('lang') || 'ar';
      if (savedLang === 'en') {
        document.body.classList.add('en');
        document.documentElement.dir = 'ltr';
        document.documentElement.lang = 'en';
      } else {
        document.body.classList.remove('en');
        document.documentElement.dir = 'rtl';
        document.documentElement.lang = 'ar';
      }
      window.updateVisitorCount();
      console.log('🚀 واحة الجبري جاهزة');
    });
  </script>
