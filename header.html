        // ===== تنظيف الكاش (Cache Busting) =====
        (function() {
            if ('caches' in window) {
                caches.keys().then(function(names) {
                    names.forEach(function(name) { caches.delete(name); });
                });
            }
            console.log('🗑️ تم تنظيف الكاش تلقائياً');
        })();

        // ===== تشغيل الصوت تلقائياً =====
        document.addEventListener('click', function firstInteraction() {
            const bgMusic = document.getElementById('bgMusic');
            if (bgMusic) { bgMusic.volume = 0.3; bgMusic.play().catch(function() {}); }
            document.removeEventListener('click', firstInteraction);
        }, { once: true });

        // ===== نظام تسجيل الدخول (مصحح) =====
        const USERS = { 'admin': { password: '12345', role: 'admin', name: 'المدير' }, 'user': { password: 'user123', role: 'user', name: 'مستخدم' } };
        let currentUser = JSON.parse(localStorage.getItem('currentUser'));

        // معرّفات العناصر (لقد أضفتها لضمان عمل السكربت)
        const loginModal = document.getElementById('loginModal');
        const localLoginForm = document.getElementById('localLoginForm');
        const localUsername = document.getElementById('localUsername');
        const localPassword = document.getElementById('localPassword');
        const logoutBtn = document.getElementById('logoutBtn');
        const loginOptions = document.getElementById('loginOptions');
        const userStatus = document.getElementById('userStatus');
        const userNameText = document.getElementById('userNameText');
        const userRoleText = document.getElementById('userRoleText');
        const loginTitle = document.getElementById('loginTitle');

        // دوال فتح وإغلاق المودال
        function openLoginModal() { loginModal.classList.add('active'); updateLoginUI(); }
        function closeLoginModalFn() { loginModal.classList.remove('active'); localLoginForm.classList.remove('active'); }
        
        // الأحداث
        document.getElementById('loginBtn').addEventListener('click', openLoginModal);
        document.getElementById('closeLoginModal').addEventListener('click', closeLoginModalFn);
        loginModal.addEventListener('click', function(e) { if (e.target === this) closeLoginModalFn(); });

        // تحديث واجهة المستخدم
        function updateLoginUI() {
            if (currentUser) {
                userStatus.style.display = 'block'; loginOptions.style.display = 'none'; logoutBtn.style.display = 'block';
                userNameText.textContent = currentUser.name; userRoleText.textContent = currentUser.role;
                loginTitle.innerHTML = '👤 <span class="ar">مرحباً</span><span class="en">Welcome</span> ' + currentUser.name;
            } else {
                userStatus.style.display = 'none'; loginOptions.style.display = 'block'; logoutBtn.style.display = 'none';
                loginTitle.innerHTML = '🔐 <span class="ar">تسجيل الدخول</span><span class="en">Login</span>';
                localLoginForm.classList.remove('active');
            }
        }

        // تسجيل الدخول عبر جوجل
        document.getElementById('googleLoginBtn').addEventListener('click', function() {
            currentUser = { name: 'مستخدم Google', role: 'google', email: 'user@gmail.com' };
            localStorage.setItem('currentUser', JSON.stringify(currentUser));
            updateLoginUI();
            setTimeout(closeLoginModalFn, 1500);
        });

        // تبديل الفورم المحلي
        document.getElementById('localLoginToggle').addEventListener('click', function() { 
            localLoginForm.classList.toggle('active'); 
        });

        // دالة تسجيل الدخول المحلي (تم إصلاحها هنا)
        function localLogin() {
            const username = localUsername.value.trim();
            const password = localPassword.value.trim();
            
            // ⚠️ هنا السطر الذي تم تصحيحه وإكماله
            if (!username || !password) {
                alert('⚠️ الرجاء إدخال اسم المستخدم وكلمة المرور');
                return;
            }

            const user = USERS[username];
            if (user && user.password === password) {
                currentUser = { name: user.name, role: user.role };
                localStorage.setItem('currentUser', JSON.stringify(currentUser));
                closeLoginModalFn();
                alert('✅ تم تسجيل الدخول بنجاح');
            } else {
                alert('❌ اسم المستخدم أو كلمة المرور غير صحيحة');
            }
        }

        // ربط زر تسجيل الدخول المحلي بالدالة
        document.getElementById('localLoginBtn').addEventListener('click', localLogin);

        // تسجيل الخروج
        function logout() {
            currentUser = null;
            localStorage.removeItem('currentUser');
            updateLoginUI();
            alert('تم تسجيل الخروج');
        }
        
        // ربط زر الخروج بالدالة
        logoutBtn.addEventListener('click', logout);

        // ===== دوال الإعدادات =====
        function openSettings() { document.getElementById('settingsOverlay').classList.add('active'); }
        function closeSettings() { document.getElementById('settingsOverlay').classList.remove('active'); }
        function setMode(mode) {
            document.body.className = mode + ' device-desktop';
            document.getElementById('dayBtn').classList.toggle('active', mode==='day');
            document.getElementById('nightBtn').classList.toggle('active', mode==='night');
        }
        function setDevice(device) {
            document.body.className = document.body.className.replace(/device-\w+/, 'device-' + device);
            document.getElementById('desktopBtn').classList.toggle('active', device==='desktop');
            document.getElementById('phoneBtn').classList.toggle('active', device==='phone');
        }

        // ===== دوال الواجهة العامة =====
        window.toggleMusic = function() {
            const audio = document.getElementById('bgMusic');
            if (!audio) return;
            const btn = document.getElementById('musicBottomBtn');
            if (audio.paused) {
                audio.play().catch(() => {});
                btn.textContent = '🔊';
                btn.classList.add('playing');
            } else {
                audio.pause();
                btn.textContent = '🎵';
                btn.classList.remove('playing');
            }
        };

        window.toggleChat = function() {
            alert('💬 المحادثة قيد التطوير... قريباً بإذن الله!\n\n📧 للتواصل: jabri62018@gmail.com');
        };

        window.toggleMenu = function() {
            document.getElementById('sideMenu').classList.toggle('open');
            document.getElementById('menuOverlay').classList.toggle('active');
        };
        window.closeMenu = function() {
            document.getElementById('sideMenu').classList.remove('open');
            document.getElementById('menuOverlay').classList.remove('active');
        };

        window.toggleLang = function() {
            const next = document.documentElement.lang === 'ar' ? 'en' : 'ar';
            document.documentElement.dir = next === 'en' ? 'ltr' : 'rtl';
            document.documentElement.lang = next;
            localStorage.setItem('lang', next);
            
            document.querySelectorAll('.top-btn.lang, .bottom-btn.lang').forEach(btn => {
                btn.innerHTML = next === 'en' ? '<span class="ar">🇾🇪 عربي</span><span class="en">🇬🇧 EN</span>' : '<span class="ar">🇾🇪 عربي</span><span class="en">🇬🇧 EN</span>';
            });
        };

        // ===== التهيئة الأولية =====
        document.addEventListener('DOMContentLoaded', function() {
            const savedLang = localStorage.getItem('lang') || 'ar';
            document.documentElement.dir = savedLang === 'en' ? 'ltr' : 'rtl';
            document.documentElement.lang = savedLang;
            updateLoginUI();
        });
    </script>
