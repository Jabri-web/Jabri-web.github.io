  <!-- ===== السكربت الرئيسي ===== -->
  <script>
    // ===== توحيد الدوال على window =====
    window.toggleLang = function() {
      const current = document.body.classList.contains('en') ? 'en' : 'ar';
      const next = current === 'ar' ? 'en' : 'ar';
      document.body.classList.toggle('en', next === 'en');
      document.documentElement.dir = next === 'en' ? 'ltr' : 'rtl';
      document.documentElement.lang = next === 'en' ? 'en' : 'ar';
      localStorage.setItem('lang', next);
      
      document.getElementById('langTopBtn').innerHTML = next === 'en' ? '<span class="ar">🇾🇪 عربي</span><span class="en">🇬🇧 EN</span>' : '<span class="ar">🇾🇪 عربي</span><span class="en">🇬🇧 EN</span>';
      document.getElementById('langBottomBtn').innerHTML = next === 'en' ? '<span class="ar">🇾🇪 عربي</span><span class="en">🇬🇧 EN</span>' : '<span class="ar">🇾🇪 عربي</span><span class="en">🇬🇧 EN</span>';
    };

    window.toggleMusic = function() {
      const audio = document.getElementById('oasisMusic');
      if (!audio) return;
      const btns = document.querySelectorAll('#musicTopBtn, #musicBottomBtn');
      if (audio.paused) {
        audio.play().catch(() => {});
        btns.forEach(b => { b.textContent = '🔊'; b.classList.add('playing'); });
      } else {
        audio.pause();
        btns.forEach(b => { b.textContent = '🎵'; b.classList.remove('playing'); });
      }
    };

    window.toggleChat = function() {
      alert('💬 المحادثة قيد التطوير... قريباً بإذن الله!\n\n📧 للتواصل: jabri62018@gmail.com');
    };

    window.toggleMenu = function() {
      const menu = document.getElementById('sideMenu');
      const overlay = document.getElementById('menuOverlay');
      menu.classList.toggle('open');
      overlay.classList.toggle('active');
    };

    window.closeMenu = function() {
      document.getElementById('sideMenu').classList.remove('open');
      document.getElementById('menuOverlay').classList.remove('active');
    };

    window.updateVisitorCount = function() {
      let count = parseInt(localStorage.getItem('jabri_visitor_count') || '0', 10);
      count += 1;
      localStorage.setItem('jabri_visitor_count', count);
      document.getElementById('visitorCountTop').textContent = count;
      document.getElementById('visitorCountBottom').textContent = count;
    };

    // ===== الأزرار الوسطى =====
    window.sharePage = function() {
      if (navigator.share) {
        navigator.share({
          title: document.title,
          text: '🌹 واحة الجبري | نظرية السندباد الموحدة Z+C+A=1',
          url: window.location.href
        }).catch(() => {});
      } else {
        navigator.clipboard.writeText(window.location.href)
          .then(() => alert('✅ تم نسخ الرابط!'))
          .catch(() => alert('📋 الرابط: ' + window.location.href));
      }
    };

    window.likePage = function() {
      let likes = parseInt(localStorage.getItem('jabri_likes') || '0', 10);
      likes += 1;
      localStorage.setItem('jabri_likes', likes);
      alert('👍 شكراً لإعجابك! (' + likes + ')');
    };

    window.dislikePage = function() {
      let dislikes = parseInt(localStorage.getItem('jabri_dislikes') || '0', 10);
      dislikes += 1;
      localStorage.setItem('jabri_dislikes', dislikes);
      alert('👎 تم تسجيل رأيك!');
    };

    document.addEventListener('DOMContentLoaded', function() {
      const savedLang = localStorage.getItem('lang') || 'ar';
      if (savedLang === 'en') {
        document.body.classList.add('en');
        document.documentElement.dir = 'ltr';
        document.documentElement.lang = 'en';
      } else {
        document.body.classList.remove('en');
        document.documentElement.dir = 'rtl';
        document.documentElement.lang = 'ar';
      }
      window.updateVisitorCount();
      console.log('🚀 واحة الجبري | القائمة الكاملة مع الأزرار الوسطى');
    });
  </script>

<script>
// ===== تشغيل الصوت تلقائي بعد اول تفاعل =====
(function() {
  const audio = document.getElementById('oasisMusic');
  if (!audio) return;

  let musicPlayed = false;

  function playMusic() {
    if (musicPlayed) return;
    musicPlayed = true;
    
    // إزالة المستمعين فوراً لمنع أي تنفيذ إضافي
    document.removeEventListener('click', playMusic);
    document.removeEventListener('touchstart', playMusic);
    
    audio.volume = 1;
    audio.play().then(() => {
      document.querySelectorAll('#musicTopBtn, #musicBottomBtn').forEach(b => {
        b.textContent = '🔊'; 
        b.classList.add('playing');
      });
      console.log('🎵 تم تشغيل الموسيقى تلقائياً');
    }).catch(err => {
      // إذا فشل التشغيل، نسمح للمستخدم بتشغيلها يدوياً لاحقاً
      musicPlayed = false; // نعيد العلم للخلف ليتسنى للمستخدم تشغيلها لاحقاً
      console.log('لم يتم تشغيل الصوت تلقائياً:', err);
    });
  }

  document.addEventListener('click', playMusic);
  document.addEventListener('touchstart', playMusic);

  // دالة التبديل اليدوي (تم تعديلها قليلاً)
  window.toggleMusic = function() {
    if (!audio) return;
    const btns = document.querySelectorAll('#musicTopBtn, #musicBottomBtn');
    if (audio.paused) {
      audio.play().then(() => {
        btns.forEach(b => { b.textContent = '🔊'; b.classList.add('playing'); });
        musicPlayed = true; // نؤكد أن الموسيقى مشغلة
      }).catch(() => {});
    } else {
      audio.pause();
      btns.forEach(b => { b.textContent = '🎵'; b.classList.remove('playing'); });
    }
  };
})();
</script>
