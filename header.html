    // ─────────────────────────────────────────────

    // ─────────────────────────────────────────────
    var ownershipTags = [

        m.content = tag.content;

    // ─────────────────────────────────────────────

    if (!head.querySelector('meta[name="description"]')) {

    ogTags.forEach(function(tag) {
      var sel = tag.prop
        ? 'meta[property="' + tag.prop + '"]'

      if (!head.querySelector(sel)) {
        var m = document.createElement('meta');

        m.content = tag.content;
        head.appendChild(m);

    // ─────────────────────────────────────────────
    //  6. Article meta

    var articleTags = [

    // ─────────────────────────────────────────────

    if (!head.querySelector('link[rel="manifest"]')) {

    if (!head.querySelector('link[rel="canonical"]')) {

    // ─────────────────────────────────────────────

    var favicons = [

    favicons.forEach(function(f) {
      var sel = 'link[rel="' + f.rel + '"]' + (f.sizes ? '[sizes="' + f.sizes + '"]' : '');
      if (!head.querySelector(sel)) {
        var link = document.createElement('link');
        link.rel = f.rel;
        if (f.type) link.type = f.type;
        if (f.sizes) link.sizes = f.sizes;
        link.href = f.href;
        head.appendChild(link);
      }
    });

    // ─────────────────────────────────────────────
    //  10. hreflang — يُزيل ar و en
    // ─────────────────────────────────────────────
    var path = location.pathname.replace(/^\/(en|ar)\//, '/');

    var hreflangs = [
      { lang: 'ar', href: BASE_URL + path },
      { lang: 'en', href: BASE_URL + '/en' + path },

    hreflangs.forEach(function(h) {
      if (!head.querySelector('link[hreflang="' + h.lang + '"]')) {
        var link = document.createElement('link');
        link.rel = 'alternate';
        link.hreflang = h.lang;
        link.href = h.href;
        head.appendChild(link);
      }
    });

    // ─────────────────────────────────────────────
    //  11. prev/next/up — للكتاب
    // ─────────────────────────────────────────────
    var pageLinks = {
      '/Page1.html':   { prev: null,           next: '/Page2.html',  up: '/research.html' },
      '/Page2.html':   { prev: '/Page1.html',  next: '/Page3.html',  up: '/research.html' },
      '/Page3.html':   { prev: '/Page2.html',  next: '/Page4.html',  up: '/research.html' },

      '/Page12.html':  { prev: '/Page11.html', next: null,           up: '/research.html' }
    };

    var links = pageLinks[location.pathname];
    if (links) {
      ['prev', 'next', 'up'].forEach(function(rel) {
        if (!links[rel]) return;
        if (!head.querySelector('link[rel="' + rel + '"]')) {
          var link = document.createElement('link');
          link.rel = rel;
          link.href = BASE_URL + links[rel];
          head.appendChild(link);
        }
      });
    }

    // ─────────────────────────────────────────────
    //  12. Google News — pub_time مستقل لكل صفحة
    // ─────────────────────────────────────────────
    var now = new Date().toISOString();
    var pageKey = 'jabri_pub_' + location.pathname;
    var publishedTime = localStorage.getItem(pageKey) || now;
    if (!localStorage.getItem(pageKey)) {
      try { localStorage.setItem(pageKey, now); } catch (e) {}
    }

    var newsTags = [
      { name: 'news_keywords', content: 'واحة الجبري, تراث اليمن, Z(x), نظرية السندباد, عبدالله الجبري' },
      { prop: 'article:publisher', content: BASE_URL },
      { prop: 'article:published_time', content: publishedTime },
      { prop: 'article:modified_time', content: now },
      { prop: 'article:author', content: BASE_URL + '/Author-cv.html' }
    ];

    newsTags.forEach(function(tag) {
      var sel = tag.prop
        ? 'meta[property="' + tag.prop + '"]'
        : 'meta[name="' + tag.name + '"]';
      if (!head.querySelector(sel)) {
        var m = document.createElement('meta');
        if (tag.prop) m.setAttribute('property', tag.prop);
        if (tag.name) m.name = tag.name;
        m.content = tag.content;
        head.appendChild(m);
      }
    });

    // ─────────────────────────────────────────────
    //  13. Schema.org JSON-LD — NewsMediaOrganization
    // ─────────────────────────────────────────────
    if (!document.getElementById('jabriSchemaLD')) {
      var schema = document.createElement('script');
      schema.id = 'jabriSchemaLD';
      schema.type = 'application/ld+json';
      schema.textContent = JSON.stringify({
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Person",
            "@id": BASE_URL + "/#jabri",
            "name": "م/ عبدالله محمد ناصر الجبري",
            "alternateName": ["Heaven Al-Jabri", "Eng. Abdulla Mohammed Nasser Al-Jabri", "واحة الجبري", "سندباد اليمن"],

            "familyName": "الجبري",

            "gender": "Male",

            "identifier": "https://orcid.org/0009-0003-3319-3822",
            "jobTitle": "باحث ومبرمج ومؤسس",
            "description": "الباحث اليمني، المؤسس، المالك، الناشر، المحرر، المصمم، المبرمج، وصاحب حقوق النشر لموقع واحة الجبري.",
            "knowsAbout": ["الرياضيات", "الفيزياء النظرية", "فرضية ريمان", "نظرية السندباد الموحدة", "تراث اليمن", "البرمجة", "الذكاء الاصطناعي"],
            "alumniOf": { "@type": "CollegeOrUniversity", "name": "جامعة الملك فهد للبترول والمعادن (KFUPM)" },
            "sameAs": [
              "https://orcid.org/0009-0003-3319-3822",
              "https://github.com/Jabri-web",
              "https://zenodo.org/records/20513840",
              "https://wikibin.org/articles/abdulla-mohammed-nasser-al-jabri.html",

              "https://www.facebook.com/share/p/1CvCG9xehw/",
              "https://www.instagram.com/reel/Da5zRhypJlo/",
              "https://t.me/Heaven_Jabri/",
              "https://www.linkedin.com/in/abdulla-al-jabri-bb545830b"
            ]
          },
          {
            "@type": "NewsMediaOrganization",
            "@id": BASE_URL + "/#organization",

            "inLanguage": ["ar", "en"],

    // ─────────────────────────────────────────────
    //  14. الخطوط + Font Awesome
    // ─────────────────────────────────────────────
    if (!head.querySelector('link[href*="fonts.googleapis.com"]')) {
      var pre1 = document.createElement('link');
      pre1.rel = 'preconnect';
      pre1.href = 'https://fonts.googleapis.com';
      head.appendChild(pre1);

      var pre2 = document.createElement('link');
      pre2.rel = 'preconnect';
      pre2.href = 'https://fonts.gstatic.com';
      pre2.crossOrigin = 'anonymous';
      head.appendChild(pre2);

    if (!head.querySelector('link[href*="font-awesome"]')) {

      fa.rel = 'stylesheet';
      fa.href = 'https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css';
      head.appendChild(fa);
    }

    if (!head.querySelector('link[href*="Cairo"]')) {
      var fonts = document.createElement('link');
      fonts.rel = 'stylesheet';
      fonts.href = 'https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Tajawal:wght@400;500;700&display=swap';
      head.appendChild(fonts);
    }

    console.log('✅ [header v4.1] SEO + NewsMediaOrganization + pub_time per-page — ready');
  }

  // ✅ تشغيل فوري (head موجود دائماً)
  addMetaTags();

})();
</script>

<!-- JavaScript الموحّد                                          -->
<!-- ========================================================== -->
<script>
(function() {
    'use strict';

    // ========== كشف البيئة ==========
    var IS_APK = (location.protocol === 'file:') ||
                 (navigator.userAgent.indexOf('wv') !== -1) ||
                 (location.protocol !== 'http:' && location.protocol !== 'https:' &&
                  location.hostname.indexOf('vercel') === -1 &&
                  location.hostname.indexOf('github') === -1);

    console.log('%c🌍 [header] البيئة: ' + (IS_APK ? '📱 APK' : '🌐 Web'),
                'color:#ffd700;font-weight:700');

    // ========== عناصر UI ==========
    var loginModal = document.getElementById('loginModal');
    var localLoginForm = document.getElementById('localLoginForm');
    var localUsername = document.getElementById('localUsername');
    var localPassword = document.getElementById('localPassword');
    var logoutBtn = document.getElementById('logoutBtn');
    var loginOptions = document.getElementById('loginOptions');
    var userStatus = document.getElementById('userStatus');
    var userNameText = document.getElementById('userNameText');
    var userRoleText = document.getElementById('userRoleText');
    var loginTitle = document.getElementById('loginTitle');

    // ========== تحديث واجهة الدخول ==========
    function updateLoginUI() {
        var user = (window.WahaAuth && window.WahaAuth.getUser) ? window.WahaAuth.getUser() : null;
        if (user) {
            userStatus.style.display = 'block';
            loginOptions.style.display = 'none';
            logoutBtn.style.display = 'block';
            userNameText.textContent = user.name || 'مستخدم';
            userRoleText.textContent = user.role || 'زائر';
            loginTitle.innerHTML = '👤 مرحباً ' + (user.name || 'مستخدم');
        } else {
            userStatus.style.display = 'none';
            loginOptions.style.display = 'block';
            logoutBtn.style.display = 'none';
            loginTitle.innerHTML = '🔐 تسجيل الدخول';
            localLoginForm.classList.remove('active');
        }
    }

    window.openLoginModal = function() {
        loginModal.classList.add('active');
        updateLoginUI();
    };
    window.closeLoginModalFn = function() {
        loginModal.classList.remove('active');
        localLoginForm.classList.remove('active');
    };

    function localLogin() {
        if (!window.WahaAuth) {
            alert('⚠️ نظام الدخول لم يُحمّل بعد، حاول مرة أخرى');
            return;
        }
        var res = window.WahaAuth.loginLocal(localUsername.value, localPassword.value);
        if (res.ok) {
            localUsername.value = '';
            localPassword.value = '';
            updateLoginUI();
            setTimeout(window.closeLoginModalFn, 800);
        } else {
            alert('❌ ' + res.error);
        }
    }

    function logout() {
        if (window.WahaAuth) window.WahaAuth.logout();
        updateLoginUI();
    }

    var loginBtnEl = document.getElementById('loginBtn');
    if (loginBtnEl) loginBtnEl.addEventListener('click', window.openLoginModal);

    if (loginModal) {
        loginModal.addEventListener('click', function(e) {
            if (e.target === loginModal) window.closeLoginModalFn();
        });
    }

    var googleBtn = document.getElementById('googleLoginBtn');
    if (googleBtn) {
        googleBtn.addEventListener('click', function() {
            if (window.WahaAuth) window.WahaAuth.loginGoogle();
            updateLoginUI();
            setTimeout(window.closeLoginModalFn, 1200);
        });
    }

    var localToggle = document.getElementById('localLoginToggle');
    if (localToggle) {
        localToggle.addEventListener('click', function() {
            localLoginForm.classList.toggle('active');
        });
    }

    var localLoginBtn = document.getElementById('localLoginBtn');
    if (localLoginBtn) localLoginBtn.addEventListener('click', localLogin);

    if (logoutBtn) logoutBtn.addEventListener('click', logout);

    window.addEventListener('waha:auth-changed', updateLoginUI);

    // ========== الإعدادات ==========
    window.openSettings = function() {
        document.getElementById('settingsOverlay').classList.add('active');
    };
    window.closeSettings = function() {
        document.getElementById('settingsOverlay').classList.remove('active');
    };
    window.setMode = function(mode) {
        var device = (document.body.className.split(' ').find(function(c){return c.indexOf('device-')===0;}) || 'device-desktop');
        document.body.className = mode + ' ' + device;
        var dayBtn = document.getElementById('dayBtn');
        var nightBtn = document.getElementById('nightBtn');
        if (dayBtn) dayBtn.classList.toggle('active', mode === 'day');
        if (nightBtn) nightBtn.classList.toggle('active', mode === 'night');
        try { localStorage.setItem('theme', mode); } catch(e){}
    };
    window.setDevice = function(device) {
        document.body.className = document.body.className.replace(/device-\w+/, 'device-' + device);
        var desktopBtn = document.getElementById('desktopBtn');
        var phoneBtn = document.getElementById('phoneBtn');
        if (desktopBtn) desktopBtn.classList.toggle('active', device === 'desktop');
        if (phoneBtn) phoneBtn.classList.toggle('active', device === 'phone');
        try { localStorage.setItem('device', device); } catch(e){}
    };

    // ========== الموسيقى ==========
    window.toggleMusic = function() {
        var audio = document.getElementById('bgMusic');
        var btn = document.getElementById('musicBottomBtn');
        if (!audio || !btn) return;
        if (audio.paused) {
            audio.volume = 0.3;
            audio.play().catch(function() {});
            btn.textContent = '🔊';
            btn.classList.add('playing');
        } else {
            audio.pause();
            btn.textContent = '🎵';
            btn.classList.remove('playing');
        }
    };

    // ========== صوت الخلفية ==========
    window.toggleBgSound = function() {
        var video = document.getElementById('bgVideo');
        var audio = document.getElementById('bgMusic');
        var btn = document.getElementById('soundBtn');
        if (!video || !audio || !btn) return;
        var isPlaying = !video.muted || !audio.paused;

        if (isPlaying) {
            video.muted = true;
            audio.pause();
            btn.innerHTML = '🔊 تشغيل الصوت';
        } else {
            video.muted = false;
            video.play().catch(function() {});
            audio.volume = 0.3;
            audio.play().catch(function() {});
            btn.innerHTML = '🔇 كتم الصوت';
        }
    };

    // ========== المحادثة ==========
    window.toggleChat = function() {
        window.open('/publish/publish-auto.html', '_blank');
    };

    // ========== القائمة الجانبية ==========
    window.toggleSideMenu = function() {
        var sm = document.getElementById('sideMenu');
        var mo = document.getElementById('menuOverlay');
        if (sm) sm.classList.toggle('open');
        if (mo) mo.classList.toggle('active');
    };
    window.closeMenu = function() {
        var sm = document.getElementById('sideMenu');
        var mo = document.getElementById('menuOverlay');
        if (sm) sm.classList.remove('open');
        if (mo) mo.classList.remove('active');
    };
    if (!window.toggleMenu) {
        window.toggleMenu = window.toggleSideMenu;
    }

    // ========== التهيئة ==========
    document.addEventListener('DOMContentLoaded', function() {
        var savedLang = localStorage.getItem('waha_lang') || localStorage.getItem('lang') || 'ar';
        if (savedLang === 'en') {
            document.documentElement.dir = 'ltr';
            document.documentElement.lang = 'en';
        } else {
            document.documentElement.dir = 'rtl';
            document.documentElement.lang = 'ar';
        }

        var savedTheme = localStorage.getItem('theme') || 'night';
        var savedDevice = localStorage.getItem('device') || 'desktop';
        document.body.classList.remove('day', 'night', 'device-desktop', 'device-phone');
        document.body.classList.add(savedTheme, 'device-' + savedDevice);

        var nightBtn = document.getElementById('nightBtn');
        var dayBtn = document.getElementById('dayBtn');
        var desktopBtn = document.getElementById('desktopBtn');
        var phoneBtn = document.getElementById('phoneBtn');
        if (nightBtn) nightBtn.classList.toggle('active', savedTheme === 'night');
        if (dayBtn) dayBtn.classList.toggle('active', savedTheme === 'day');
        if (desktopBtn) desktopBtn.classList.toggle('active', savedDevice === 'desktop');
        if (phoneBtn) phoneBtn.classList.toggle('active', savedDevice === 'phone');

        updateLoginUI();

        document.addEventListener('click', function firstInteraction() {
            var audio = document.getElementById('bgMusic');
            if (audio && audio.paused) {
                audio.volume = 0.3;
                audio.play().catch(function() {});
            }
            document.removeEventListener('click', firstInteraction);
        }, { once: true });
    });

})();
</script>

<div id="updatePopup" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.85); z-index:99999; align-items:center; justify-content:center; backdrop-filter:blur(8px);">
    <div style="background:linear-gradient(135deg,#1a1a1a,#2d2d2d); border:2px solid #c9a227; border-radius:24px; padding:32px 24px; max-width:90%; width:400px; text-align:center; box-shadow:0 20px 60px rgba(201,162,39,0.4);">
        <div style="font-size:64px; margin-bottom:16px;">🎉</div>
        <h2 style="color:#c9a227; font-size:22px; margin:0 0 12px; font-family:'Cairo',sans-serif;">واحة الجبري تحدّثت!</h2>
        <p style="color:#c9d1d9; font-size:15px; line-height:1.7; margin:0 0 24px;">
            تم تحميل الإصدار الجديد بنجاح.<br>
            استمتع بالتجربة المحسّنة ✨
        </p>
        <button onclick="closeAndReload()" style="background:linear-gradient(135deg,#c9a227,#e6c34a); color:#0d1117; border:none; padding:14px 40px; border-radius:30px; font-size:16px; font-weight:bold; cursor:pointer; font-family:'Cairo',sans-serif; box-shadow:0 6px 20px rgba(201,162,39,0.5);">
            رائع! 🚀
        </button>
    </div>
</div>

<script>
    if ('serviceWorker' in navigator &&
        (location.protocol === 'https:' || location.protocol === 'http:')) {

        window.addEventListener('load', function() {
            navigator.serviceWorker.register('/sw.js').then(function(reg) {
                reg.addEventListener('updatefound', function() {
                    var newWorker = reg.installing;
                    newWorker.addEventListener('statechange', function() {
                        if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                            document.getElementById('updatePopup').style.display = 'flex';
                        }
                    });
                });
            }).catch(function(e) {
                console.warn('⚠️ [sw] فشل التسجيل:', e.message);
            });
        });
    } else {
        console.log('⏭️ [sw] تم تخطي Service Worker (بيئة APK / file://)');
    }

    function closeAndReload() {
        if (navigator.serviceWorker.controller) {
            navigator.serviceWorker.controller.postMessage('SKIP_WAITING');
        }
        document.getElementById('updatePopup').style.display = 'none';
        setTimeout(function() { window.location.reload(); }, 500);
    }
</script>

<div id="apk-overlay" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.8); z-index: 999999; justify-content: center; align-items: center; font-family: 'Cairo', sans-serif; direction: rtl; backdrop-filter: blur(5px);">
    <div style="background: linear-gradient(135deg, #1a1a1a, #2d2d2d); padding: 30px; border-radius: 20px; text-align: center; max-width: 350px; width: 90%; border: 2px solid #c9a227; box-shadow: 0 20px 60px rgba(201, 162, 39, 0.5); position: relative;">
        <span id="apk-close-x" style="position: absolute; top: 10px; left: 15px; font-size: 28px; cursor: pointer; color: #c9a84c; transition: 0.3s;" onmouseover="this.style.color='#ffd700'" onmouseout="this.style.color='#c9a84c'">&times;</span>
        <img src="/image/Yemen2026.png" alt="App Icon" style="width: 90px; height: 90px; margin-bottom: 15px; border-radius: 20px; object-fit: cover; border: 2px solid #c9a227;">
        <h3 style="margin: 10px 0; color: #c9a227; font-size: 22px; font-weight: 900;">تطبيق واحة الجبري</h3>
        <p style="color: #c9d1d9; font-size: 15px; line-height: 1.6; margin-bottom: 25px;">للحصول على أفضل تجربة وتصفح أسرع، قم بتحميل تطبيقنا الآن.</p>
        <a href="/app-release.apk" download style="display: block; background: linear-gradient(135deg, #c9a227, #e6c34a); color: #0d1117; text-decoration: none; padding: 14px; border-radius: 30px; font-weight: bold; font-size: 16px; margin-bottom: 15px; transition: transform 0.3s; box-shadow: 0 6px 20px rgba(201,162,39,0.5);" onmouseover="this.style.transform='scale(1.05)'" onmouseout="this.style.transform='scale(1)'">⬇️ تحميل التطبيق (APK)</a>
        <button id="apk-close-btn" style="background: transparent; border: none; color: #888; cursor: pointer; font-size: 14px; padding: 5px; font-family: 'Cairo', sans-serif;">لاحقاً</button>
    </div>
</div>

<script>
    document.addEventListener("DOMContentLoaded", function() {
        var isAPK = (location.protocol === 'file:') ||
                    (navigator.userAgent.indexOf('wv') !== -1);

        if (!isAPK && !sessionStorage.getItem('apk_prompt_dismissed')) {
            setTimeout(function() {
                var overlay = document.getElementById('apk-overlay');
                if (overlay) overlay.style.display = 'flex';
            }, 4000);
        }
        function closeOverlay() {
            var overlay = document.getElementById('apk-overlay');
            if (overlay) {
                overlay.style.display = 'none';
                try { sessionStorage.setItem('apk_prompt_dismissed', 'true'); } catch(e){}
            }
        }
        var closeX = document.getElementById('apk-close-x');
        var closeBtn = document.getElementById('apk-close-btn');
        if (closeX) closeX.addEventListener('click', closeOverlay);
        if (closeBtn) closeBtn.addEventListener('click', closeOverlay);
        var overlay = document.getElementById('apk-overlay');
        if (overlay) {
            overlay.addEventListener('click', function(e) {
                if (e.target === overlay) closeOverlay();
            });
        }
    });
</script>
