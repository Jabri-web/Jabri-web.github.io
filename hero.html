<!DOCTYPE html>
<html lang="ar" dir="rtl">

    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0b0f19; /* خلفية داكنة */
            color: #ffffff;
            margin: 0;
            padding: 0;
            text-align: center;
        }
        .hero {
            padding: 80px 20px;
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 70vh;
        }
        .main-text {
            font-size: 3.5rem;
            font-weight: 900;
            line-height: 1.3;
            margin-bottom: 20px;
            color: #f1c40f; /* اللون الذهبي */
            text-shadow: 0 0 20px rgba(241, 196, 15, 0.4);
        }
        .sub-text {
            font-size: 1.5rem;
            color: #bdc3c7;

            max-width: 800px;
        }
        .button-container {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .btn {
            text-decoration: none;
            padding: 15px 30px;
            border-radius: 50px;
            font-size: 1.2rem;
            font-weight: bold;
            transition: all 0.3s ease;
        }
        .btn-primary {
            background-color: #f1c40f;
            color: #0b0f19;
            box-shadow: 0 4px 15px rgba(241, 196, 15, 0.3);
        }
        .btn-primary:hover {
            background-color: #d4ac0d;
            transform: translateY(-3px);
        }
        .btn-secondary {
            background-color: transparent;
            color: #f1c40f;
            border: 2px solid #f1c40f;
        }
        .btn-secondary:hover {
            background-color: rgba(241, 196, 15, 0.1);
            transform: translateY(-3px);
        }

</head>
