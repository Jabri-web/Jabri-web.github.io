<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>حاسبة النظرية الموحدة | Unified Theory Calculator</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0f0c29;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            text-align: center;
            overflow-x: hidden;
        }
        h1 { color: #ffd700; text-shadow: 0 0 15px rgba(255, 215, 0, 0.6); font-size: 22px; }
        h3 { color: #8ab4f8; margin-top: 0; font-size: 16px; }
        
        .input-group {
            margin: 20px auto;
            background: rgba(255, 255, 255, 0.1);
            padding: 20px;
            border-radius: 12px;
            display: inline-block;
            width: 90%;
            max-width: 400px;
        }
        input {
            padding: 12px;
            border-radius: 8px;
            border: 2px solid #ffd700;
            background: transparent;
            color: white;
            font-size: 18px;
            width: 100px;
            text-align: center;
            margin-bottom: 10px;
        }
        button {
            padding: 12px 25px;
            border-radius: 8px;
            border: none;
            background: #ffd700;
            color: #000;
            font-weight: bold;
            cursor: pointer;
            font-size: 18px;
            width: 100%;
            margin-top: 10px;
        }
        button:hover { background: #ffe066; }
        
        .canvas-container {
            width: 95%;
            max-width: 600px;
            margin: 20px auto;
            background: #000;
            padding: 10px;
            border-radius: 15px;
            border: 1px solid #444;
        }
        
        table { margin: 20px auto; border-collapse: collapse; width: 95%; max-width: 600px; background: #1a1a2e; font-size: 12px; }
        th, td { border: 1px solid #444; padding: 6px; }
        th { background: #0d1117; color: #ffd700; }
        td { color: #ddd; }
        tr:nth-child(even) { background: rgba(255, 255, 255, 0.05); }
        .gold-line { color: #ffd700; font-weight: bold; }
    </style>
</head>
<body>

    <h1>🌌 حاسبة النظرية الموحدة</h1>
    <h3>Zx = Z + C + A = 1</h3>


<div style="margin-top: 15px; margin-bottom: 25px;">
  <a href="journal4.html" style="text-decoration: none; background-color: #0f3460; color: #e0c097; padding: 10px 20px; border-radius: 5px; border: 1px solid #e0c097; font-weight: bold; transition: 0.3s;">🌳 العودة إلى شجرة التوحيد (Journal 4)</a>
</div>

    <div class="input-group">
        <label for="xInput">أدخل أقصى قيمة (x):</label><br>
        <input type="number" id="xInput" value="5" step="0.1" min="0.1">
        <button onclick="runCalculator()">🚀 احسب وارسم</button>
        <button onclick="downloadImage()" style="background-color: #444; color: white; margin-top: 5px;">📥 تحميل الرسم</button>
    </div>

    <div class="canvas-container">
        <h3 style="color:white;">📈 الرسم البياني</h3>
        <canvas id="myCanvas" style="width: 100%; background: #000;"></canvas>
    </div>

    <table>
        <thead>
            <tr>
                <th>x</th>
                <th>Z(x)</th>
                <th>C(x)</th>
                <th>A(x)</th>
                <th>Zx (Total)</th>
            </tr>
        </thead>
        <tbody id="tableBody"></tbody>
    </table>

    <script>
        // دالة التطبيع
        function normalize(arr) {
            var min = Math.min.apply(null, arr);
            var max = Math.max.apply(null, arr);
            return arr.map(function(val) { return (val - min) / (max - min); });
        }

        function runCalculator() {
            var maxX = parseFloat(document.getElementById('xInput').value);
            if (isNaN(maxX) || maxX <= 0) { alert("أدخل قيمة أكبر من 0"); return; }

            // تصفير الجدول
            document.getElementById('tableBody').innerHTML = '';
            
            var labels = [];
            var rawZ = [];
            var rawA = [];

            // حساب القيم الخام
            for (var x = 0.1; x <= maxX; x += 0.1) {
                x = Math.round(x * 10) / 10;
                labels.push(x);
                rawZ.push(Math.pow(x, 5) * Math.log(x) * Math.sin(Math.PI * x / 2.0) * Math.exp(-x));
                rawA.push(Math.pow(x, 2) * Math.exp(-x));
            }

            // التطبيع
            var Z = normalize(rawZ);
            var A = normalize(rawA);
            var C = [];
            var Total = [];

            // بناء الجدول
            for (var i = 0; i < labels.length; i++) {
                var c = 1 - Z[i] - A[i];
                var total = Z[i] + c + A[i];
                C.push(c);
                Total.push(total);

                var row = '<tr>' +
                    '<td>' + labels[i].toFixed(2) + '</td>' +
                    '<td>' + Z[i].toFixed(4) + '</td>' +
                    '<td>' + c.toFixed(4) + '</td>' +
                    '<td>' + A[i].toFixed(4) + '</td>' +
                    '<td class="gold-line">' + total.toFixed(4) + '</td>' +
                '</tr>';
                document.getElementById('tableBody').innerHTML += row;
            }

            // الرسم اليدوي (Canvas)
            drawGraph(labels, Z, C, A, Total);
        }

        function drawGraph(xLabels, zData, cData, aData, totalData) {
            var canvas = document.getElementById('myCanvas');
            var ctx = canvas.getContext('2d');
            
            // جعل الرسم يتكيف مع الشاشة
            var W = canvas.parentElement.clientWidth - 20;
            var H = W * 0.6; // نسبة الطول للعرض
            canvas.width = W;
            canvas.height = H;
            
            ctx.clearRect(0, 0, W, H);

            // المحاور
            var margin = 40;
            var chartW = W - margin * 2;
            var chartH = H - margin * 2;
            var maxY = 1.2;
            var minY = 0;
            var minX = xLabels[0];
            var maxX = xLabels[xLabels.length - 1];

            function getX(x) { return margin + ((x - minX) / (maxX - minX)) * chartW; }
            function getY(y) { return H - margin - ((y - minY) / (maxY - minY)) * chartH; }

            // الشبكة
            ctx.strokeStyle = 'rgba(255,255,255,0.2)';
            ctx.lineWidth = 1;
            for (var i = 0; i <= 5; i++) {
                var y = minY + (maxY - minY) * (i / 5);
                ctx.beginPath();
                ctx.moveTo(margin, getY(y));
                ctx.lineTo(W - margin, getY(y));
                ctx.stroke();
                // الأرقام
                ctx.fillStyle = '#ccc';
                ctx.font = '12px Arial';
                ctx.textAlign = 'right';
                ctx.fillText(y.toFixed(1), margin - 5, getY(y) + 4);
            }

            // رسم الخطوط
            function plot(data, color, width, dash) {
                ctx.strokeStyle = color;
                ctx.lineWidth = width;
                ctx.setLineDash(dash || []);
                ctx.beginPath();
                for (var i = 0; i < data.length; i++) {
                    var px = getX(xLabels[i]);
                    var py = getY(data[i]);
                    if (i === 0) ctx.moveTo(px, py);
                    else ctx.lineTo(px, py);
                }
                ctx.stroke();
                ctx.setLineDash([]);
            }

            plot(zData, '#00bfff', 3);
            plot(cData, '#32cd32', 3);
            plot(aData, '#ff4500', 3);
            plot(totalData, '#ffd700', 4, [8, 4]); // الذهبي المتقطع

            // أسماء المحاور
            ctx.fillStyle = '#fff';
            ctx.font = '14px Arial';
            ctx.textAlign = 'center';
            ctx.fillText('x', W / 2, H - 5);
            ctx.fillText('Values', 15, H / 2);
        }

        // زر تحميل الرسم
        function downloadImage() {
            var canvas = document.getElementById('myCanvas');
            var link = document.createElement('a');
            link.download = 'Jabri_Unified_Theory.png';
            link.href = canvas.toDataURL('image/png');
            link.click();
        }

        // تشغيل تلقائي عند فتح الصفحة
        window.onload = function() {
            runCalculator();
        };
    </script>
</body>
</html>
