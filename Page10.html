    <!-- ============================================ -->
    <!--       الفوتر سيتم تحميله عبر JavaScript       -->

    <!-- ============================================ -->
    <!--          سكريبت تبديل اللغة (يدوي)           -->
    <!-- ============================================ -->

    <script>
        // دالة تطبيق اللغة (بدون إعادة توجيه)
        function applyLanguage(lang) {
            document.documentElement.lang = lang;
            document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
            document.body.classList.remove('ar', 'en');
            document.body.classList.add(lang);

            // تحديث أزرار اللغة
            const langAr = document.getElementById('lang-ar');
            const langEn = document.getElementById('lang-en');
            if (langAr) langAr.classList.toggle('active', lang === 'ar');
            if (langEn) langEn.classList.toggle('active', lang === 'en');

            // تحديث الفوتر (استدعاء الدالة الموجودة في الملف الخارجي)
            if (typeof updateFooterLang === 'function') {
                updateFooterLang();
            }

            localStorage.setItem('preferred-language', lang);
            console.log(`✅ تم تطبيق اللغة: ${lang}`);
        }

        // دالة تبديل اللغة (تُستدعى من الأزرار)
        window.toggleLang = function() {
            const currentLang = document.documentElement.lang || 'ar';
            const newLang = currentLang === 'en' ? 'ar' : 'en';
            applyLanguage(newLang);
            console.log(`🔄 تم تبديل اللغة من ${currentLang} إلى ${newLang}`);
        };

        window.applyLanguage = applyLanguage;

        // تحميل اللغة المحفوظة عند بدء الصفحة
        document.addEventListener('DOMContentLoaded', function() {
            const savedLang = localStorage.getItem('preferred-language') || 'ar';
            applyLanguage(savedLang);
        });
    </script>
