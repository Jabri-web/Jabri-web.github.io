<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📊 مركز تشخيص المستودعات | Diagnose 2.0</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<style>
:root{--bg:#0a0a0f;--text:#e0e0e0;--card:#1a1a24;--primary:#ff6b6b;--secondary:#8892bf;--success:#4CAF50;--warning:#ffa500}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:'Tajawal',sans-serif;padding:20px;transition:.3s}
body.light{--bg:#f0f0f5;--text:#1a1a24;--card:#ffffff}
h1{color:var(--primary);font-size:2.2rem;margin-bottom:5px}
.subtitle{color:var(--secondary);font-size:1rem;margin-bottom:20px}
.header-actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:15px 0}
.header-actions button{background:var(--card);color:var(--text);border:1px solid rgba(255,255,255,0.1);padding:10px 20px;border-radius:10px;cursor:pointer;transition:.3s;font-family:'Tajawal',sans-serif;font-weight:700}
.header-actions button:hover{background:var(--primary);color:#fff;transform:scale(1.05)}
.header-actions button.primary{background:var(--primary);color:#fff}
.header-actions button.primary:hover{background:#e55a5a}
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:15px;margin:20px 0}
.stat-card{background:var(--card);padding:20px;border-radius:12px;border:1px solid rgba(255,255,255,0.05);transition:.3s}
.stat-card:hover{transform:translateY(-3px);border-color:var(--secondary)}
.stat-number{font-size:2.5rem;font-weight:900;color:var(--primary)}
.stat-label{color:var(--secondary);font-size:0.9rem;margin-top:5px}
.repo-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:20px;margin:20px 0}
.repo-card{background:var(--card);border-radius:16px;padding:20px;border:1px solid rgba(255,255,255,0.05);transition:.3s;cursor:pointer;position:relative}
.repo-card:hover{transform:translateY(-5px);border-color:var(--secondary);box-shadow:0 8px 30px rgba(0,0,0,0.3)}
.repo-card .repo-name{font-size:1.2rem;font-weight:700;color:var(--primary)}
.repo-card .repo-path{color:var(--secondary);font-size:0.8rem;font-family:monospace;margin:5px 0}
.repo-card .repo-stats{display:flex;gap:15px;flex-wrap:wrap;margin:10px 0}
.repo-card .repo-stats span{background:rgba(255,255,255,0.05);padding:4px 12px;border-radius:20px;font-size:0.8rem}
.repo-card .repo-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.repo-card .repo-actions button{background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);color:var(--text);padding:6px 14px;border-radius:8px;cursor:pointer;font-size:0.8rem;transition:.3s;font-family:'Tajawal',sans-serif}
.repo-card .repo-actions button:hover{background:var(--primary);color:#fff}
.repo-card .status-badge{position:absolute;top:10px;left:10px;padding:4px 12px;border-radius:20px;font-size:0.7rem;font-weight:700}
.status-online{background:#4CAF50;color:#fff}
.status-offline{background:#ff6b6b;color:#fff}
.status-unknown{background:#ffa500;color:#fff}
.modal{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.85);z-index:999;justify-content:center;align-items:center;backdrop-filter:blur(8px)}
.modal.active{display:flex}
.modal-content{background:var(--card);border-radius:20px;padding:30px;max-width:700px;width:90%;max-height:80vh;overflow-y:auto;border:1px solid rgba(255,255,255,0.1)}
.modal-content h2{color:var(--primary);margin-bottom:15px}
.modal-content .close-btn{background:var(--primary);color:#fff;border:none;padding:8px 20px;border-radius:8px;cursor:pointer;float:left;font-family:'Tajawal',sans-serif}
.modal-content .file-list{list-style:none;padding:0}
.modal-content .file-list li{background:rgba(255,255,255,0.03);padding:8px 12px;margin:5px 0;border-radius:8px;display:flex;justify-content:space-between;align-items:center;font-size:0.9rem}
.modal-content .file-list li .file-size{color:var(--secondary);font-size:0.7rem}
.modal-content .file-list li .file-delete{background:#ff6b6b;color:#fff;border:none;padding:2px 10px;border-radius:6px;cursor:pointer;font-size:0.7rem}
.modal-content .file-list li .file-delete:hover{transform:scale(1.1)}
.loading-spinner{display:inline-block;width:20px;height:20px;border:3px solid rgba(255,255,255,0.1);border-top-color:var(--primary);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.toast{position:fixed;bottom:20px;right:20px;background:var(--card);color:#fff;padding:12px 20px;border-radius:12px;opacity:0;transition:.3s;z-index:999;border:1px solid rgba(255,255,255,0.1);max-width:400px}
.toast.show{opacity:1}
.search-box{background:var(--card);padding:10px 20px;border-radius:30px;border:1px solid rgba(255,255,255,0.1);color:var(--text);width:100%;max-width:400px;font-family:'Tajawal',sans-serif;margin:10px auto;display:block}
.search-box:focus{outline:none;border-color:var(--secondary)}
.upload-area{border:2px dashed var(--secondary);padding:20px;border-radius:12px;margin:15px 0;text-align:center;cursor:pointer;transition:.3s}
.upload-area:hover{background:rgba(136,146,191,0.05)}
.upload-area input[type="file"]{display:none}
/* ===== الطباعة ===== */
@media print {
  body{background:#fff;color:#000;padding:10px}
  .header-actions,.search-box,.toast,.modal,.refresh-btn{display:none !important}
  .repo-card{break-inside:avoid;border:1px solid #ddd;background:#f9f9f9}
  .repo-card .repo-name{color:#000}
  .repo-card .repo-path{color:#555}
  .repo-card .repo-stats span{background:#eee;color:#000}
  .status-badge{display:none}
  .stat-card{background:#f9f9f9;border:1px solid #ddd}
  .stat-number{color:#000}
  .stat-label{color:#555}
  .repo-grid{display:block}
  .repo-card{margin-bottom:15px}
}
</style>
</head>
<body>

<div id="toast" class="toast"></div>

<h1>📊 مركز تشخيص المستودعات</h1>
<div class="subtitle">🔍 تشخيص وإدارة 12 مستودعاً • GitHub API</div>

<div class="header-actions">
    <button onclick="scanAllRepos()" class="primary">🔄 فحص الكل</button>
    <button onclick="toggleTheme()">🌓 الوضع</button>
    <button onclick="printReport()">🖨️ طباعة</button>
    <button onclick="exportHTML()">📄 تصدير HTML</button>
    <button onclick="exportTXT()">📤 تصدير TXT</button>
</div>

<input class="search-box" id="searchBox" placeholder="🔍 ابحث عن مستودع..." oninput="filterRepos(this.value)">

<div class="stats-grid" id="statsGrid">
    <div class="stat-card"><div class="stat-number" id="totalRepos">0</div><div class="stat-label">📁 إجمالي المستودعات</div></div>
    <div class="stat-card"><div class="stat-number" id="totalFiles">0</div><div class="stat-label">📄 إجمالي الملفات</div></div>
    <div class="stat-card"><div class="stat-number" id="totalSize">0</div><div class="stat-label">💾 الحجم الإجمالي</div></div>
    <div class="stat-card"><div class="stat-number" id="totalCommits">0</div><div class="stat-label">📝 إجمالي الكوميتات</div></div>
</div>

<div class="repo-grid" id="repoGrid">
    <p style="grid-column:1/-1;text-align:center;color:var(--secondary);padding:40px;">
        👆 اضغط <strong>"فحص الكل"</strong> لعرض المستودعات
    </p>
</div>

<!-- ===== مودال التفاصيل ===== -->
<div class="modal" id="detailModal">
    <div class="modal-content">
        <button class="close-btn" onclick="closeModal()">✕ إغلاق</button>
        <h2 id="modalTitle">📂 المستودع</h2>
        <div id="modalBody">جاري التحميل...</div>
        <div class="upload-area" onclick="document.getElementById('fileUpload').click()">
            📤 اضغط لرفع ملفات
            <input type="file" id="fileUpload" multiple onchange="uploadFiles(this.files)">
        </div>
    </div>
</div>

<script>
// ============================================================
// ===== قائمة المستودعات الـ 12 =====
// ============================================================
const REPOS = [
    { id: 1, name: 'jabri62018.github.io', path: 'Jabri-web/jabri62018.github.io' },
    { id: 2, name: 'Zx_RieOS_v1.2', path: 'Jabri-web/Zx_RieOS_v1.2' },
    { id: 3, name: 'Zx_Mother_Function_Jabri', path: 'Jabri-web/Zx_Mother_Function_Jabri' },
    { id: 4, name: 'Jabri-web.github.io', path: 'Jabri-web/Jabri-web.github.io' },
    { id: 5, name: 'Jabri_Nobble', path: 'Jabri-web/Jabri_Nobble' },
    { id: 6, name: 'Jabri_lab', path: 'Jabri-web/Jabri_lab' },
    { id: 7, name: 'Zx_RieOS_v1.1', path: 'Jabri-web/Zx_RieOS_v1.1' },
    { id: 8, name: 'Jabri_RiemannOS', path: 'Jabri-web/Jabri_RiemannOS' },
    { id: 9, name: 'Jabri_Checkout', path: 'Jabri-web/Jabri_Checkout' },
    { id: 10, name: 'Jabri-web', path: 'Jabri-web/Jabri-web' },
    { id: 11, name: 'jabri-com', path: 'Jabri-web/jabri-com' },
    { id: 12, name: 'jabri.com', path: 'Jabri-web/jabri.com' }
];

let repoData = {};
let isDark = true;
let currentFilter = '';
let currentRepoId = null;
let isScanned = false;

function showToast(msg, type = 'info') {
    const toast = document.getElementById('toast');
    toast.textContent = msg;
    toast.style.background = type === 'error' ? '#ff6b6b' : type === 'success' ? '#4CAF50' : type === 'warning' ? '#ffa500' : 'var(--card)';
    toast.classList.add('show');
    clearTimeout(toast._timeout);
    toast._timeout = setTimeout(() => toast.classList.remove('show'), 4000);
}

function toggleTheme() {
    isDark = !isDark;
    document.body.classList.toggle('light', !isDark);
    localStorage.setItem('diagnoseTheme', isDark ? 'dark' : 'light');
}

// ===== 1. جلب معلومات المستودع =====
async function fetchRepoInfo(repo) {
    try {
        const apiUrl = `https://api.github.com/repos/${repo.path}`;
        const response = await fetch(apiUrl);
        if (response.status === 403) {
            return { error: 'Rate Limit' };
        }
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        return await response.json();
    } catch (e) {
        return { error: e.message };
    }
}

async function fetchRepoContents(repo) {
    try {
        const apiUrl = `https://api.github.com/repos/${repo.path}/contents`;
        const response = await fetch(apiUrl);
        if (response.status === 403) return [];
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        return await response.json();
    } catch (e) {
        return [];
    }
}

// ===== 2. فحص كل المستودعات =====
async function scanAllRepos() {
    showToast('🔄 جاري فحص المستودعات...', 'info');
    document.getElementById('repoGrid').innerHTML = '<p style="grid-column:1/-1;text-align:center;color:var(--secondary);padding:40px;"><span class="loading-spinner"></span> جاري الفحص...</p>';
    
    let totalFiles = 0, totalSize = 0, totalCommits = 0;
    
    for (const repo of REPOS) {
        const info = await fetchRepoInfo(repo);
        const contents = await fetchRepoContents(repo);
        
        repoData[repo.id] = {
            ...repo,
            info: info,
            contents: contents,
            files: contents.filter(c => c.type === 'file'),
            dirs: contents.filter(c => c.type === 'dir'),
            size: contents.reduce((sum, c) => sum + (c.size || 0), 0),
            status: info.id ? 'online' : 'offline'
        };
        
        if (info.id) {
            totalFiles += repoData[repo.id].files.length;
            totalSize += repoData[repo.id].size;
            totalCommits += info.size || 0;
        }
    }
    
    document.getElementById('totalRepos').textContent = REPOS.length;
    document.getElementById('totalFiles').textContent = totalFiles.toLocaleString();
    document.getElementById('totalSize').textContent = formatSize(totalSize);
    document.getElementById('totalCommits').textContent = totalCommits.toLocaleString();
    
    isScanned = true;
    renderRepos();
    showToast('✅ تم فحص ' + REPOS.length + ' مستودع', 'success');
}

// ===== 3. عرض المستودعات =====
function renderRepos(filter = '') {
    const grid = document.getElementById('repoGrid');
    let html = '';
    
    const filtered = REPOS.filter(r => {
        const data = repoData[r.id];
        if (!data) return false;
        const nameMatch = r.name.toLowerCase().includes(filter.toLowerCase());
        const pathMatch = r.path.toLowerCase().includes(filter.toLowerCase());
        return nameMatch || pathMatch;
    });
    
    if (filtered.length === 0) {
        grid.innerHTML = '<p style="grid-column:1/-1;text-align:center;color:var(--secondary);padding:40px;">🔍 لا توجد نتائج</p>';
        return;
    }
    
    filtered.forEach(r => {
        const data = repoData[r.id];
        if (!data) return;
        
        const info = data.info || {};
        const files = data.files || [];
        const dirs = data.dirs || [];
        const status = data.status || 'unknown';
        const statusClass = status === 'online' ? 'status-online' : status === 'offline' ? 'status-offline' : 'status-unknown';
        const statusLabel = status === 'online' ? '🟢 متصل' : status === 'offline' ? '🔴 غير متصل' : '🟡 غير معروف';
        
        const images = files.filter(f => /\.(png|jpg|jpeg|gif|webp|svg)$/i.test(f.name));
        const videos = files.filter(f => /\.(mp4|webm|mov|avi|mkv)$/i.test(f.name));
        const audios = files.filter(f => /\.(mp3|wav|ogg|m4a|flac)$/i.test(f.name));
        const codes = files.filter(f => /\.(js|html|css|py|java|cpp|php|rb|go|json|xml)$/i.test(f.name));
        
        html += `
            <div class="repo-card" onclick="showRepoDetail(${r.id})">
                <span class="status-badge ${statusClass}">${statusLabel}</span>
                <div class="repo-name">📁 ${r.name}</div>
                <div class="repo-path">${r.path}</div>
                <div class="repo-stats">
                    <span>📄 ${files.length} ملف</span>
                    <span>📁 ${dirs.length} مجلد</span>
                    <span>💾 ${formatSize(data.size)}</span>
                    ${info.size ? `<span>📝 ${info.size.toLocaleString()} كوميت</span>` : ''}
                </div>
                <div style="display:flex;gap:8px;flex-wrap:wrap;margin:8px 0;font-size:0.8rem;">
                    ${images.length > 0 ? `<span style="background:rgba(255,107,107,0.2);padding:2px 10px;border-radius:12px;">🖼️ ${images.length}</span>` : ''}
                    ${videos.length > 0 ? `<span style="background:rgba(136,146,191,0.2);padding:2px 10px;border-radius:12px;">🎬 ${videos.length}</span>` : ''}
                    ${audios.length > 0 ? `<span style="background:rgba(76,175,80,0.2);padding:2px 10px;border-radius:12px;">🎵 ${audios.length}</span>` : ''}
                    ${codes.length > 0 ? `<span style="background:rgba(255,165,0,0.2);padding:2px 10px;border-radius:12px;">💻 ${codes.length}</span>` : ''}
                </div>
                <div class="repo-actions">
                    <button onclick="event.stopPropagation();openRepo('${r.path}')">🔗 فتح</button>
                    <button onclick="event.stopPropagation();showRepoDetail(${r.id})">📊 تفاصيل</button>
                    <button onclick="event.stopPropagation();deleteRepo(${r.id})" style="background:rgba(255,107,107,0.2);border-color:#ff6b6b;">🗑️ حذف</button>
                </div>
            </div>
        `;
    });
    
    grid.innerHTML = html;
}

function filterRepos(value) {
    currentFilter = value;
    renderRepos(value);
}

// ===== 4. التفاصيل =====
async function showRepoDetail(id) {
    const data = repoData[id];
    if (!data) return;
    currentRepoId = id;
    
    const modal = document.getElementById('detailModal');
    document.getElementById('modalTitle').textContent = `📂 ${data.name}`;
    
    let body = `
        <div style="margin-bottom:15px;">
            <p><strong>المسار:</strong> ${data.path}</p>
            <p><strong>الحالة:</strong> ${data.status === 'online' ? '🟢 متصل' : '🔴 غير متصل'}</p>
            <p><strong>الملفات:</strong> ${data.files.length}</p>
            <p><strong>المجلدات:</strong> ${data.dirs.length}</p>
            <p><strong>الحجم:</strong> ${formatSize(data.size)}</p>
            ${data.info?.size ? `<p><strong>الكوميتات:</strong> ${data.info.size.toLocaleString()}</p>` : ''}
        </div>
        <h4>📄 قائمة الملفات (${data.files.length})</h4>
        <ul class="file-list">
    `;
    
    data.files.slice(0, 50).forEach(f => {
        const size = formatSize(f.size || 0);
        const ext = f.name.split('.').pop() || '?';
        body += `<li>
            <span>${f.name}</span>
            <span>
                <span class="file-size">${size} • ${ext}</span>
                <button class="file-delete" onclick="deleteFile('${data.path}','${f.name}')">🗑️</button>
            </span>
        </li>`;
    });
    
    if (data.files.length > 50) {
        body += `<li style="color:var(--secondary);text-align:center;">... و ${data.files.length - 50} ملف آخر</li>`;
    }
    
    body += `</ul>`;
    document.getElementById('modalBody').innerHTML = body;
    modal.classList.add('active');
}

function closeModal() {
    document.getElementById('detailModal').classList.remove('active');
}

// ===== 5. حذف =====
async function deleteFile(repoPath, fileName) {
    if (!confirm(`⚠️ هل أنت متأكد من حذف "${fileName}"؟`)) return;
    showToast(`🗑️ جاري حذف ${fileName}...`, 'info');
    try {
        const shaRes = await fetch(`https://api.github.com/repos/${repoPath}/contents/${fileName}`);
        if (!shaRes.ok) throw new Error('فشل الحصول على SHA');
        const shaData = await shaRes.json();
        const deleteRes = await fetch(`https://api.github.com/repos/${repoPath}/contents/${fileName}`, {
            method: 'DELETE',
            headers: { 'Authorization': `token ${prompt('🔑 أدخل GitHub Token:')}` },
            body: JSON.stringify({ message: `حذف ${fileName}`, sha: shaData.sha })
        });
        if (deleteRes.ok) {
            showToast('✅ تم الحذف', 'success');
            scanAllRepos();
        } else showToast('❌ فشل الحذف', 'error');
    } catch (e) {
        showToast('❌ خطأ: ' + e.message, 'error');
    }
}

// ===== 6. رفع =====
async function uploadFiles(files) {
    if (!currentRepoId) { showToast('⚠️ افتح مستودعاً أولاً', 'warning'); return; }
    const repo = REPOS.find(r => r.id === currentRepoId);
    if (!repo) return;
    for (const file of files) {
        showToast(`📤 رفع ${file.name}...`, 'info');
        try {
            const reader = new FileReader();
            reader.onload = async (e) => {
                const content = btoa(e.target.result);
                const uploadRes = await fetch(`https://api.github.com/repos/${repo.path}/contents/${file.name}`, {
                    method: 'PUT',
                    headers: { 'Authorization': `token ${prompt('🔑 أدخل GitHub Token:')}` },
                    body: JSON.stringify({ message: `رفع ${file.name}`, content: content })
                });
                if (uploadRes.ok) { showToast(`✅ تم رفع ${file.name}`, 'success'); scanAllRepos(); }
                else showToast(`❌ فشل رفع ${file.name}`, 'error');
            };
            reader.readAsBinaryString(file);
        } catch (e) { showToast(`❌ خطأ في ${file.name}`, 'error'); }
    }
}

function openRepo(path) {
    window.open(`https://github.com/${path}`, '_blank');
    showToast(`🔗 فتح ${path}`, 'info');
}

function deleteRepo(id) {
    if (confirm(`⚠️ حذف "${REPOS.find(r => r.id === id)?.name}"؟`)) {
        const index = REPOS.findIndex(r => r.id === id);
        if (index !== -1) { REPOS.splice(index, 1); delete repoData[id]; renderRepos(currentFilter); showToast('🗑️ تم الحذف', 'success'); }
    }
}

// ===== 7. طباعة =====
function printReport() {
    if (!isScanned) { showToast('⚠️ افحص المستودعات أولاً', 'warning'); return; }
    window.print();
}

// ===== 8. تصدير HTML =====
function exportHTML() {
    if (!isScanned) { showToast('⚠️ افحص المستودعات أولاً', 'warning'); return; }
    const content = document.documentElement.outerHTML;
    const blob = new Blob([`<!DOCTYPE html>\n${content}`], { type: 'text/html;charset=utf-8' });
    const link = document.createElement('a');
    link.href = URL.createObjectURL(blob);
    link.download = `diagnose-report-${new Date().toISOString().slice(0,10)}.html`;
    link.click();
    URL.revokeObjectURL(link.href);
    showToast('📄 تم تصدير HTML', 'success');
}

// ===== 9. تصدير TXT =====
function exportTXT() {
    if (!isScanned) { showToast('⚠️ افحص المستودعات أولاً', 'warning'); return; }
    let report = '📊 تقرير المستودعات - Diagnose 2.0\n';
    report += '='.repeat(50) + '\n';
    report += `📅 ${new Date().toLocaleString()}\n\n`;
    
    REPOS.forEach(r => {
        const data = repoData[r.id];
        if (!data) return;
        report += `📁 ${r.name}\n`;
        report += `   المسار: ${r.path}\n`;
        report += `   الملفات: ${data.files.length}\n`;
        report += `   المجلدات: ${data.dirs.length}\n`;
        report += `   الحجم: ${formatSize(data.size)}\n`;
        report += `   الحالة: ${data.status}\n\n`;
    });
    
    const blob = new Blob([report], { type: 'text/plain;charset=utf-8' });
    const link = document.createElement('a');
    link.href = URL.createObjectURL(blob);
    link.download = `diagnose-report-${new Date().toISOString().slice(0,10)}.txt`;
    link.click();
    URL.revokeObjectURL(link.href);
    showToast('📤 تم تصدير TXT', 'success');
}

function formatSize(bytes) {
    if (bytes === 0) return '0 B';
    const k = 1024;
    const sizes = ['B', 'KB', 'MB', 'GB', 'TB'];
    const i = Math.floor(Math.log(bytes) / Math.log(k));
    return parseFloat((bytes / Math.pow(k, i)).toFixed(1)) + ' ' + sizes[i];
}

// ===== 10. التهيئة =====
window.onload = () => {
    if (localStorage.getItem('diagnoseTheme') === 'light') {
        isDark = false;
        document.body.classList.add('light');
    }
    document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') closeModal();
        if ((e.key === 'r' || e.key === 'R') && !e.ctrlKey) scanAllRepos();
    });
};
